<!DOCTYPE html>
<html lang="es">
<head>
<base href="/demo-la-posta/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Posta · Menú</title>
<meta name="description" content="Cortes frescos de carne de cerdo. Pedidos por WhatsApp hasta la puerta de tu casa.">
<meta name="theme-color" content="#F7AFAF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F7AFAF; --pink-soft:#FDE8E8; --pink-deep:#E98A8A;
  --brown:#3B2622; --brown-2:#6B4E48; --cream:#FFFAF8; --line:#F1D6D3;
  --wa:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--cream);color:var(--brown);padding-bottom:110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- Hero ---------- */
.hero{position:relative;background:var(--pink);padding:28px 16px 34px;text-align:center;overflow:hidden;border-radius:0 0 32px 32px}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.logo{width:112px;height:112px;border-radius:50%;background:#fff;margin:0 auto 10px;overflow:hidden;box-shadow:0 10px 30px rgba(59,38,34,.15);position:relative;z-index:1}
.logo img{width:100%;height:100%;object-fit:contain;padding:6px}
.hero .script{font-family:Allura,cursive;font-size:44px;line-height:1;color:var(--brown);position:relative;z-index:1}
.hero h1{font-size:26px;font-weight:700;letter-spacing:.06em;margin-top:-4px;position:relative;z-index:1}
.hero .sub{font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-top:6px;color:var(--brown-2);position:relative;z-index:1}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:16px;position:relative;z-index:1}
.tags span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.55);padding:6px 10px;border-radius:99px}

/* ---------- Toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,250,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:15px;background:none;color:var(--brown)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;font-size:13px;font-weight:500;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);transition:.2s}
.cat.on{background:var(--brown);color:#fff;border-color:var(--brown)}

/* ---------- Grid ---------- */
main{padding:6px 16px 0;max-width:980px;margin:0 auto}
section h2{font-family:Allura,cursive;font-weight:400;font-size:38px;margin:22px 0 8px;scroll-margin-top:120px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(59,38,34,.1)}}
.media{position:relative;aspect-ratio:4/5;background:radial-gradient(circle at 50% 60%,#fff 0%,var(--pink-soft) 70%);overflow:hidden;display:grid;place-items:center}
.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media img{width:84%;height:70%;object-fit:contain;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(59,38,34,.18))}
.media .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(4px) rotate(-2deg) scale(1)}50%{transform:translateY(-6px) rotate(2deg) scale(1.04)}}
@keyframes shine{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brown);color:#fff;padding:5px 8px;border-radius:99px;z-index:2}
.info{padding:10px 12px 12px}
.info h3{font-size:14px;font-weight:600;line-height:1.25}
.price{font-size:13px;color:var(--brown-2);margin-top:4px}
.price b{color:var(--brown);font-weight:700;font-size:15px}
.empty{text-align:center;padding:40px 0;color:var(--brown-2);display:none}

/* ---------- Detail sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(30,18,16,.5);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:50;max-height:94vh;overflow:auto}
.sheet.on{transform:none}
.sheet .media{aspect-ratio:auto;height:min(62vh,560px);border-radius:28px 28px 0 0}
.sheet .media img{width:78%;height:70%}
.close{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:20px}
.sheet .body{padding:18px 18px 22px}
.sheet h3{font-size:22px;font-weight:700}
.sheet .note{font-size:13px;color:var(--brown-2);margin-top:4px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt .n{font-weight:600;font-size:15px}
.opt .p{font-size:13px;color:var(--brown-2)}
.step{display:flex;align-items:center;gap:4px;background:var(--pink-soft);border-radius:99px;padding:4px}
.step button{width:34px;height:34px;border-radius:50%;background:#fff;font-size:18px;font-weight:600}
.step span{min-width:56px;text-align:center;font-weight:600;font-size:14px}

/* ---------- Order bar ---------- */
.order{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:30;display:flex;align-items:center;gap:10px;background:var(--brown);color:#fff;border-radius:20px;padding:10px 10px 10px 16px;box-shadow:0 14px 34px rgba(59,38,34,.3);transition:transform .3s}
.order.hide{transform:translateY(160%)}
.test-banner{position:sticky;top:0;z-index:60;background:#FFE08A;color:#5A4300;text-align:center;font-size:12px;font-weight:700;padding:8px 12px}
.free{background:var(--pink-soft);border-radius:14px;padding:12px;margin-top:14px;font-size:13px}
.free-bar{height:8px;border-radius:99px;background:#fff;margin-top:8px;overflow:hidden}
.free-bar i{display:block;height:100%;background:var(--wa);border-radius:99px;transition:width .3s}
.weight-note{font-size:12px;color:var(--brown-2);margin-top:8px}
.go{width:100%;justify-content:center;margin-top:14px;border:0;font-size:15px;padding:14px}
.back{font-size:13px;color:var(--brown-2);margin-bottom:6px}
.f{display:block;font-size:13px;font-weight:600;margin-top:14px}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;font:inherit;font-weight:400;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.loc{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px dashed var(--pink-deep);font-weight:600;font-size:14px}
.loc.ok{border-style:solid;border-color:var(--wa);color:#137a3a}
.sum{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .tot{font-weight:700;font-size:16px}
.err{color:#B3261E;font-weight:600;font-size:14px;margin-top:10px;min-height:1px}
.note{font-size:13px}
.preview{white-space:pre-wrap;background:#E7FFDB;border-radius:12px;padding:12px;font-size:13px;line-height:1.45;margin-top:14px;color:#1F2C1A}
.preview-label{font-size:12px;font-weight:600;color:var(--brown-2);margin-top:16px}
.order .t{flex:1;font-size:13px;line-height:1.3;text-align:left;color:#fff}
.order .t u{opacity:.8}
.cart-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-row img{width:52px;height:52px;object-fit:contain;border-radius:12px;background:var(--pink-soft)}
.cart-row .n{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.cart-row .n small{display:block;font-weight:400;color:var(--brown-2);font-size:12px}
.trash{width:34px;height:34px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;font-size:16px}
.cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:16px 0 4px}
.clear{width:100%;margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--line);color:#B3261E;font-weight:600}
.order .t b{font-size:16px}
.wa{display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;font-weight:700;font-size:14px;padding:12px 14px;border-radius:14px;text-decoration:none;white-space:nowrap}
footer{text-align:center;font-size:12px;color:var(--brown-2);padding:30px 16px 10px;line-height:1.7}
footer b{color:var(--brown)}
</style>
</head>
<body>

<header class="hero">
  <div class="logo"><img src="logo.png" alt="La Posta"></div>
  <div class="script">Frescos</div>
  <h1>CORTES</h1>
  <div class="sub">de carne de cerdo</div>
  <div class="tags"><span>Naturalmente magra</span><span>Altamente nutritiva</span><span>Fácil de preparar</span></div>
</header>

<div class="bar">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Buscar corte… (ej. costilla)" autocomplete="off">
  </label>
  <nav class="cats" id="cats"></nav>
</div>

<main id="menu"></main>
<p class="empty" id="empty">No encontramos ese corte 🐷</p>

<footer>
  <b>¡Hasta la puerta de tu casa!</b><br>
  Entregas de lunes a sábado<br>
  Pago: efectivo, transferencia o tarjeta<br>
  WhatsApp <b>4186 9362</b>
</footer>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="order hide" id="order">
  <button class="t" id="oView" type="button"><span id="oCount"></span> · <u>Ver / editar</u><br><b id="oTotal"></b></button>
  <a class="wa" id="oSend" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
    Pedir
  </a>
</div>

<script>
var WA = "50241869362";
/* Test mode (?prueba in the URL): WhatsApp opens without La Posta's number, so the
   tester picks any chat (e.g. their own), and a banner + message preview are shown. */
var TEST = /[?&]prueba\b/.test(location.search);
if (TEST) document.body.insertAdjacentHTML("afterbegin",
  '<div class="test-banner">🧪 MODO PRUEBA · los pedidos NO llegan a La Posta</div>');
var V = "videos/", F = "fotos/";
var VER = "?v=5";   // bump when video files are replaced, so browsers don't show the cached copy

/* Each product: id (photo/video file name), name, category, options [label, price, unit].
   video:true means videos/<id>.mp4 exists; t = second the card video starts at (default 7). */
var PRODUCTS = [
  {id:"01-adobado", n:"Adobado", c:"Listos para cocinar", o:[["",26,"lb"]], video:true},
  {id:"04-carne-molida", n:"Carne molida", c:"Listos para cocinar", o:[["",25,"lb"]], video:true},
  {id:"06-carnitas", n:"Carnitas", c:"Listos para cocinar", o:[["",80,"lb"]], video:true},
  {id:"07-chicharrones", n:"Chicharrones", c:"Listos para cocinar", o:[["",75,"lb"]], video:true},

  {id:"08-chorizo-ahumado", n:"Chorizo ahumado", c:"Embutidos y ahumados", o:[["",2.75,"unidad"]], video:true},
  {id:"09-chorizo-colorado", n:"Chorizo colorado", c:"Embutidos y ahumados", o:[["",2.75,"unidad"]], video:true},
  {id:"10-chorizo-rodaja-tubo", n:"Chorizo", c:"Embutidos y ahumados", o:[["En rodaja",24,"lb"],["En tubo",20,"lb"]], video:true},
  {id:"21-longaniza-artesanal", n:"Longaniza artesanal", c:"Embutidos y ahumados", o:[["Unidad",2.75,"unidad"],["Rodaja",24,"lb"]], video:true},
  {id:"05-carne-prensada", n:"Carne prensada", c:"Embutidos y ahumados", o:[["Rodajas",24,"lb"],["Tubo",20,"lb"]], video:true},
  {id:"18-jamon-california", n:"Jamón California", c:"Embutidos y ahumados", o:[["Rodajas",25,"lb"]], video:true},
  {id:"30-tocino", n:"Tocino", c:"Embutidos y ahumados", o:[["",50,"lb"]], video:true},
  {id:"31-tocineta", n:"Tocineta", c:"Embutidos y ahumados", o:[["",43,"lb"]], video:true},

  {id:"12-chuleta-fresca", n:"Chuleta fresca", c:"Chuletas y lomos", o:[["",25,"lb"]], video:true},
  {id:"11-chuleta-ahumada", n:"Chuleta ahumada", c:"Chuletas y lomos", o:[["",38,"lb"]], video:true},
  {id:"37-pork-chops", n:"Pork chops", c:"Chuletas y lomos", o:[["",40,"lb"]], video:true},
  {id:"38-corona", n:"Corona", c:"Chuletas y lomos", o:[["",43,"lb"]], video:true},
  {id:"20-lomo-de-cinta", n:"Lomo de cinta", c:"Chuletas y lomos", o:[["Entero",31,"lb"],["Medallón",33,"lb"]], video:true},
  {id:"29-solomito", n:"Solomito", c:"Chuletas y lomos", o:[["",36,"lb"]], video:true},
  {id:"34-carre", n:"Carré", c:"Chuletas y lomos", o:[["",43,"lb"]], video:true},

  {id:"15-costilla-fresca", n:"Costilla fresca", c:"Costillas", o:[["Tiras",28,"lb"],["Porción",30,"lb"]], video:true, t:3},
  {id:"14-costilla-ahumada-tiras", n:"Costilla ahumada en tiras", c:"Costillas", o:[["",38,"lb"]], video:true},
  {id:"35-costilla-baby-rib", n:"Costilla Baby Rib", c:"Costillas", o:[["",43,"lb"]], video:true},
  {id:"36-costilla-st-louis", n:"Costilla St. Louis", c:"Costillas", o:[["",43,"lb"]]},
  {id:"13-costado-con-cuero", n:"Costado con cuero", c:"Costillas", o:[["",30,"lb"]]},
  {id:"17-espinazo", n:"Espinazo", c:"Costillas", o:[["",13,"lb"]]},

  {id:"23-pierna", n:"Pierna", c:"Postas y piezas", o:[["",26,"lb"]]},
  {id:"26-posta-de-pierna", n:"Posta de pierna", c:"Postas y piezas", o:[["Posta",26,"lb"],["Porción",30,"lb"]]},
  {id:"25-posta-de-nuca", n:"Posta de nuca", c:"Postas y piezas", o:[["",28,"lb"]]},
  {id:"24-posta-de-brazuelo", n:"Posta de brazuelo", c:"Postas y piezas", o:[["",26,"lb"]]},
  {id:"27-pork-belly", n:"Pork belly", c:"Postas y piezas", o:[["",35,"lb"]]},
  {id:"28-pork-wings", n:"Pork wings", c:"Postas y piezas", o:[["Frescas",38,"lb"],["Ahumadas",40,"lb"]]},
  {id:"19-lechon", n:"Lechón", c:"Postas y piezas", o:[["",45,"lb"]]},

  {id:"03-cabeza-entera", n:"Cabeza entera", c:"Otros cortes", o:[["",160,"unidad"]]},
  {id:"22-patitas-de-cerdo", n:"Patitas de cerdo", c:"Otros cortes", note:"Cortadas en 2 o 4", o:[["",14,"unidad"]]},
  {id:"02-buches", n:"Buches", c:"Otros cortes", o:[["",10,"unidad"]]},
  {id:"16-cuero", n:"Cuero", c:"Otros cortes", o:[["",14,"lb"]]},
  {id:"32-visceras-rojas", n:"Vísceras rojas", c:"Otros cortes", o:[["",25,"lb"]]},
  {id:"33-manteca", n:"Manteca", c:"Otros cortes", o:[["",14,"lb"]]}
];

var cart = {}; // key "productIndex:optionIndex" -> qty
var $ = function(s){ return document.querySelector(s); };
function money(v){ return "Q" + (v % 1 ? v.toFixed(2) : v); }
function step(u){ return u === "lb" ? 0.5 : 1; }
function qtyLabel(q,u){ return u === "lb" ? q + " lb" : q + (q === 1 ? " unidad" : " unidades"); }
function minPrice(p){ return Math.min.apply(null, p.o.map(function(o){ return o[1]; })); }

function mediaHtml(p, big){
  if (p.video) {
    /* Cards play a short pre-cut clip (<id>-card.mp4, ~150 KB, only the best part); the detail view plays the full video.
       Pre-cut because iPhone browsers ignore '#t=' start times and would show the empty opening. */
    return big
      ? '<video src="'+V+p.id+'.mp4'+VER+'" poster="'+V+p.id+'.jpg'+VER+'" muted loop autoplay playsinline preload="auto"></video>'
      : '<video src="'+V+p.id+'-card.mp4'+VER+'" poster="'+V+p.id+'.jpg'+VER+'" muted loop playsinline preload="auto"></video>';
  }
  return '<img src="'+F+p.id+'.png" alt="'+p.n+'" loading="lazy"><div class="shine"></div>';
}

/* ---------- Render menu ---------- */
var cats = [];
PRODUCTS.forEach(function(p){ if (cats.indexOf(p.c) < 0) cats.push(p.c); });

$("#cats").innerHTML = cats.map(function(c,i){
  return '<button class="cat'+(i?'':' on')+'" data-c="'+i+'">'+c+'</button>';
}).join("");

$("#menu").innerHTML = cats.map(function(c,ci){
  var cards = PRODUCTS.map(function(p,i){
    if (p.c !== c) return "";
    var u = p.o[0][2];
    return '<button class="card" data-i="'+i+'" data-s="'+(p.n+' '+p.c).toLowerCase()+'">'+
      '<div class="media">'+(p.video?'<span class="badge">▶ Video</span>':'')+mediaHtml(p,false)+'</div>'+
      '<div class="info"><h3>'+p.n+'</h3><div class="price">'+(p.o.length>1?'desde ':'')+'<b>'+money(minPrice(p))+'</b> / '+(u==="lb"?"lb":"unidad")+'</div></div>'+
    '</button>';
  }).join("");
  return '<section id="cat'+ci+'"><h2>'+c+'</h2><div class="grid">'+cards+'</div></section>';
}).join("");

/* Play card videos only while visible (saves data and battery) */
var io = new IntersectionObserver(function(es){
  es.forEach(function(e){ e.isIntersecting ? e.target.play().catch(function(){}) : e.target.pause(); });
}, {threshold:.4});
document.querySelectorAll("#menu video").forEach(function(v){
  v.muted = true;   // iOS only autoplays when the muted *property* is set
  io.observe(v);
});

/* Category chips: jump + highlight current section */
$("#cats").addEventListener("click", function(e){
  var b = e.target.closest(".cat"); if (!b) return;
  $("#q").value = ""; filter("");
  document.getElementById("cat"+b.dataset.c).scrollIntoView({behavior:"smooth"});
});
var secIo = new IntersectionObserver(function(es){
  es.forEach(function(e){
    if (!e.isIntersecting) return;
    var i = e.target.id.slice(3);
    document.querySelectorAll(".cat").forEach(function(b){ b.classList.toggle("on", b.dataset.c === i); });
    var on = document.querySelector('.cat[data-c="'+i+'"]');
    on.parentNode.scrollTo({left:on.offsetLeft-16, behavior:"smooth"});
  });
}, {rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("#menu section").forEach(function(s){ secIo.observe(s); });

/* Search */
function filter(q){
  q = q.trim().toLowerCase();
  var any = false;
  document.querySelectorAll("#menu section").forEach(function(s){
    var shown = 0;
    s.querySelectorAll(".card").forEach(function(c){
      var ok = !q || c.dataset.s.indexOf(q) >= 0;
      c.style.display = ok ? "" : "none"; if (ok) shown++;
    });
    s.style.display = shown ? "" : "none"; if (shown) any = true;
  });
  $("#empty").style.display = any ? "none" : "block";
}
$("#q").addEventListener("input", function(){ filter(this.value); });

/* ---------- Detail sheet ---------- */
var current = -1;
function openSheet(i){
  current = i;
  var p = PRODUCTS[i];
  $("#sheet").innerHTML =
    '<div class="media">'+mediaHtml(p,true)+'<button class="close" aria-label="Cerrar">×</button></div>'+
    '<div class="body"><h3>'+p.n+'</h3>'+(p.note?'<div class="note">'+p.note+'</div>':'')+
    p.o.map(function(o,oi){
      return '<div class="opt"><div><div class="n">'+(o[0]||'Cantidad')+'</div><div class="p">'+money(o[1])+' / '+(o[2]==="lb"?"lb":"unidad")+'</div></div>'+
        '<div class="step"><button data-d="-1" data-o="'+oi+'">−</button><span id="q'+oi+'"></span><button data-d="1" data-o="'+oi+'">+</button></div></div>';
    }).join("")+'</div>';
  refreshSheet();
  $("#veil").classList.add("on"); $("#sheet").classList.add("on");
  document.querySelectorAll("#menu video").forEach(function(v){ v.pause(); });
}
function closeSheet(){
  $("#veil").classList.remove("on"); $("#sheet").classList.remove("on");
  var v = $("#sheet video"); if (v) v.pause();
  current = -1; cartOpen = false;
}

/* ---------- Delivery settings — EXAMPLE values, replace with La Posta's real ones ---------- */
var ZONES = [
  ["Zona 1, 2, 3 y 4", 20], ["Zona 9, 10, 13 y 14", 25], ["Zona 11, 12, 15 y 16", 30],
  ["Mixco", 35], ["Villa Nueva", 40], ["Otra zona (indícala en la dirección)", 0], ["Recoger en tienda", 0]
];
var FREE_FROM = 300;   // free delivery from this subtotal
/* false until La Posta confirms real zones and fees: zone prices and the free-delivery bar
   are hidden and the order says the delivery cost is confirmed by WhatsApp. */
var FEES_READY = false;
var PAYS = ["Efectivo", "Transferencia", "Tarjeta"];

/* ---------- Order review + checkout ---------- */
var cartOpen = false, step2 = false, lastMsg = "";
var chk = {name:"", phone:"", zone:"", addr:"", loc:"", day:"", pay:"", notes:""};
try { Object.assign(chk, JSON.parse(localStorage.getItem("laposta-cliente") || "{}"), {day:"", notes:""}); } catch(e){}
function saveCustomer(){
  try { localStorage.setItem("laposta-cliente", JSON.stringify({name:chk.name, phone:chk.phone, zone:chk.zone, addr:chk.addr, loc:chk.loc, pay:chk.pay})); } catch(e){}
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function subtotal(){ return Object.keys(cart).reduce(function(t,k){ return t + cart[k] * PRODUCTS[+k.split(":")[0]].o[+k.split(":")[1]][1]; }, 0); }
function zoneFee(){
  if (!FEES_READY) return null;
  var z = ZONES.filter(function(z){ return z[0] === chk.zone; })[0];
  if (!z) return null;
  return subtotal() >= FREE_FROM ? 0 : z[1];
}
function r2(v){ return Math.round(v*100)/100; }

function openCart(){
  cartOpen = true; step2 = false; current = -1;
  renderCart();
  $("#veil").classList.add("on"); $("#sheet").classList.add("on");
  document.querySelectorAll("#menu video").forEach(function(v){ v.pause(); });
}
function freeBar(){
  if (!FEES_READY) return '';
  var st = subtotal(), left = FREE_FROM - st, pct = Math.min(100, st / FREE_FROM * 100);
  return '<div class="free"><div>'+(left > 0 ? '🚚 Te faltan <b>'+money(r2(left))+'</b> para <b>envío gratis</b>' : '🎉 ¡Tienes <b>envío gratis</b>!')+'</div>'+
         '<div class="free-bar"><i style="width:'+pct+'%"></i></div></div>';
}
function renderCart(){
  if (step2) return renderCheckout();
  var rows = Object.keys(cart).map(function(k){
    var p = PRODUCTS[+k.split(":")[0]], o = p.o[+k.split(":")[1]], q = cart[k];
    return '<div class="cart-row"><img src="'+F+p.id+'.png" alt="">'+
      '<div class="n">'+p.n+(o[0]?' ('+o[0]+')':'')+'<small>'+money(o[1])+' / '+(o[2]==="lb"?"lb":"unidad")+' · '+money(r2(q*o[1]))+'</small></div>'+
      '<div class="step"><button data-k="'+k+'" data-d="-1">−</button><span>'+qtyLabel(q,o[2])+'</span><button data-k="'+k+'" data-d="1">+</button></div>'+
      '<button class="trash" data-del="'+k+'" aria-label="Quitar">🗑</button></div>';
  }).join("");
  $("#sheet").innerHTML =
    '<div class="body" style="position:relative;padding-top:22px"><button class="close" aria-label="Cerrar" style="top:14px">×</button>'+
    '<h3>Tu pedido</h3>'+rows+
    '<div class="cart-total"><span>Subtotal aprox.</span><span>'+money(r2(subtotal()))+'</span></div>'+
    '<div class="weight-note">⚖️ El precio final puede variar según el peso exacto de cada corte.</div>'+
    freeBar()+
    '<button class="wa go" data-next="1">Continuar →</button>'+
    '<button class="clear" data-clear="1">Vaciar pedido</button></div>';
}
function chips(field, list){
  return '<div class="chips">'+list.map(function(v){
    return '<button type="button" class="chip'+(chk[field]===v?' on':'')+'" data-f="'+field+'" data-v="'+esc(v)+'">'+v+'</button>';
  }).join("")+'</div>';
}
function renderCheckout(){
  var fee = zoneFee(), st = subtotal();
  var pickup = chk.zone === "Recoger en tienda";
  $("#sheet").innerHTML =
    '<div class="body" style="position:relative;padding-top:22px"><button class="close" aria-label="Cerrar" style="top:14px">×</button>'+
    '<button class="back" data-back="1">← Volver al pedido</button>'+
    '<h3>Completar pedido</h3>'+
    (TEST && FEES_READY ? '<div class="note">🧪 Zonas y precios de envío son de EJEMPLO.</div>' : '')+
    '<label class="f">Tu nombre<input data-i="name" value="'+esc(chk.name)+'" placeholder="Ej. María López" autocomplete="name"></label>'+
    '<label class="f">Teléfono<input data-i="phone" value="'+esc(chk.phone)+'" placeholder="Ej. 5555 5555" inputmode="tel" autocomplete="tel"></label>'+
    '<label class="f">Zona de entrega<select data-i="zone"><option value="">Elige tu zona…</option>'+
      ZONES.map(function(z){ return '<option'+(chk.zone===z[0]?' selected':'')+' value="'+esc(z[0])+'">'+z[0]+(FEES_READY ? (z[1]?' — envío '+money(z[1]):' — sin costo') : '')+'</option>'; }).join("")+'</select></label>'+
    (pickup ? '' :
      '<label class="f">Dirección<textarea data-i="addr" rows="2" placeholder="Calle, número, colonia, referencias">'+esc(chk.addr)+'</textarea></label>'+
      '<button type="button" class="loc'+(chk.loc?' ok':'')+'" data-loc="1">'+(chk.loc ? '✅ Ubicación agregada (toca para actualizar)' : '📍 Usar mi ubicación actual')+'</button>')+
    '<div class="f">¿Qué día?'+chips("day", ["Hoy","Mañana","Pasado mañana"])+'</div>'+
    '<div class="f">Forma de pago'+chips("pay", PAYS)+'</div>'+
    (chk.pay==="Tarjeta" ? '<div class="note">💳 Al confirmar tu pedido te enviaremos un <b>link de pago seguro</b>. Nunca te pediremos los datos de tu tarjeta por WhatsApp.</div>' : '')+
    (chk.pay==="Transferencia" ? '<div class="note">🏦 Al confirmar te enviaremos los datos de la cuenta.</div>' : '')+
    '<label class="f">Notas (opcional)<textarea data-i="notes" rows="2" placeholder="Ej. chuletas finas, tocar el timbre">'+esc(chk.notes)+'</textarea></label>'+
    freeBar()+
    '<div class="sum"><div><span>Subtotal aprox.</span><span>'+money(r2(st))+'</span></div>'+
      '<div><span>Envío</span><span>'+(!FEES_READY ? (chk.zone==="Recoger en tienda" ? 'Sin costo' : 'Se confirma por WhatsApp') : fee===null ? 'Elige tu zona' : fee===0 ? 'Gratis' : money(fee))+'</span></div>'+
      '<div class="tot"><span>Total aprox.'+(FEES_READY?'':' <small style="font-weight:400">(sin envío)</small>')+'</span><span>'+money(r2(st + (fee||0)))+'</span></div></div>'+
    '<div class="weight-note">⚖️ El precio final puede variar según el peso exacto de cada corte.</div>'+
    '<div class="err" id="chkErr"></div>'+
    (TEST ? '<div class="preview-label">🧪 Vista previa del mensaje que llegaría a La Posta:</div><div class="preview">'+esc(buildMsg())+'</div>' : '')+
    '<button class="wa go" data-send="1">Enviar pedido por WhatsApp</button></div>';
}
function buildMsg(){
  var lines = Object.keys(cart).map(function(k){
    var p = PRODUCTS[+k.split(":")[0]], o = p.o[+k.split(":")[1]], q = cart[k];
    return "• " + qtyLabel(q,o[2]) + " de " + p.n + (o[0] ? " (" + o[0] + ")" : "") + " — " + money(r2(q*o[1]));
  });
  var fee = zoneFee(), st = subtotal(), pickup = chk.zone === "Recoger en tienda";
  return "¡Hola La Posta! 🐷 Quiero hacer este pedido:\n\n" + lines.join("\n") +
    "\n\nSubtotal aprox.: " + money(r2(st)) +
    "\nEnvío: " + (!FEES_READY ? (pickup ? "Recojo en tienda" : "por confirmar") : fee===null ? "—" : fee===0 ? "Gratis" : money(fee)) +
    "\n*Total aprox." + (FEES_READY ? "" : " (sin envío)") + ": " + money(r2(st + (fee||0))) + "*" +
    "\n(Entiendo que el precio final puede variar según el peso.)" +
    "\n\n👤 " + (chk.name || "—") + " · 📞 " + (chk.phone || "—") +
    "\n📦 " + (pickup ? "Recoger en tienda" : "Entrega en " + (chk.zone || "—")) +
    (pickup ? "" : "\n🏠 " + (chk.addr || "—") + (chk.loc ? "\n📍 " + chk.loc : "")) +
    "\n🗓️ " + (chk.day || "—") +
    "\n💰 Pago: " + (chk.pay || "—") +
    (chk.notes ? "\n📝 " + chk.notes : "");
}
function missing(){
  var pickup = chk.zone === "Recoger en tienda";
  if (!chk.name.trim()) return "Escribe tu nombre";
  if (!chk.phone.trim()) return "Escribe tu teléfono";
  if (!chk.zone) return "Elige tu zona de entrega";
  if (!pickup && !chk.addr.trim() && !chk.loc) return "Escribe tu dirección o usa tu ubicación";
  if (!chk.day) return "Elige el día";
  if (!chk.pay) return "Elige la forma de pago";
  return "";
}
function cartClick(e){
  var b = e.target.closest("[data-k],[data-del],[data-clear],[data-next],[data-back],[data-f],[data-loc],[data-send]"); if (!b) return;
  if (b.dataset.next) { step2 = true; return renderCart(); }
  if (b.dataset.back) { step2 = false; return renderCart(); }
  if (b.dataset.f) { chk[b.dataset.f] = b.dataset.v; return renderCart(); }
  if (b.dataset.loc) {
    if (!navigator.geolocation) return alert("Este navegador no permite compartir la ubicación. Escribe tu dirección.");
    b.textContent = "Buscando tu ubicación…";
    navigator.geolocation.getCurrentPosition(function(pos){
      chk.loc = "https://maps.google.com/?q=" + pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
      renderCart();
    }, function(err){
      /* Common inside WhatsApp/Instagram in-app browsers and private browsing, where location is blocked */
      var inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\//i.test(navigator.userAgent);
      alert(err && err.code === 1
        ? "Tu teléfono no dio permiso para usar la ubicación." + (inApp ? "\n\nSi abriste el menú desde WhatsApp o Instagram, toca ··· y elige \"Abrir en Safari\" o \"Abrir en Chrome\"." : "\n\nRevisa en Ajustes que tu navegador tenga permiso de ubicación.") + "\n\nTambién puedes escribir tu dirección."
        : "No pudimos obtener tu ubicación en este momento. Escribe tu dirección o inténtalo de nuevo.");
      renderCart();
    }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
    return;
  }
  if (b.dataset.send) {
    var m = missing();
    if (m) { $("#chkErr").textContent = "⚠️ " + m; $("#chkErr").scrollIntoView({behavior:"smooth", block:"center"}); return; }
    saveCustomer();
    window.open("https://wa.me/" + (TEST ? "" : WA) + "?text=" + encodeURIComponent(buildMsg()), "_blank");
    return;
  }
  if (b.dataset.clear) {
    if (!confirm("¿Vaciar todo el pedido?")) return;
    cart = {};
  } else if (b.dataset.del) {
    delete cart[b.dataset.del];
  } else {
    var k = b.dataset.k, o = PRODUCTS[+k.split(":")[0]].o[+k.split(":")[1]];
    var q = Math.max(0, cart[k] + (+b.dataset.d) * step(o[2]));
    if (q) cart[k] = q; else delete cart[k];
  }
  refreshOrder();
  if (Object.keys(cart).length) renderCart(); else closeSheet();
}
/* Typing in the form updates the data (and the live preview) without re-rendering the inputs */
$("#sheet").addEventListener("input", function(e){
  var f = e.target.dataset && e.target.dataset.i; if (!cartOpen || !f) return;
  chk[f] = e.target.value;
  if (f === "zone") return renderCart();
  var pv = document.querySelector("#sheet .preview"); if (pv) pv.textContent = buildMsg();
});
$("#oView").addEventListener("click", openCart);
$("#oSend").addEventListener("click", function(e){ e.preventDefault(); openCart(); });
function refreshSheet(){
  if (current < 0) return;
  PRODUCTS[current].o.forEach(function(o,oi){
    var q = cart[current+":"+oi] || 0;
    $("#q"+oi).textContent = q ? qtyLabel(q,o[2]) : "0";
  });
}
$("#menu").addEventListener("click", function(e){
  var c = e.target.closest(".card"); if (c) openSheet(+c.dataset.i);
});
$("#veil").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", function(e){
  if (e.target.closest(".close")) return closeSheet();
  if (cartOpen) return cartClick(e);
  var b = e.target.closest("[data-d]"); if (!b) return;
  var o = PRODUCTS[current].o[+b.dataset.o], k = current+":"+b.dataset.o;
  var q = Math.max(0, (cart[k]||0) + (+b.dataset.d) * step(o[2]));
  if (q) cart[k] = q; else delete cart[k];
  refreshSheet(); refreshOrder();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

/* ---------- Order → WhatsApp ---------- */
function refreshOrder(){
  var keys = Object.keys(cart), total = 0, lines = [];
  keys.forEach(function(k){
    var pi = +k.split(":")[0], oi = +k.split(":")[1], p = PRODUCTS[pi], o = p.o[oi], q = cart[k];
    total += q * o[1];
    lines.push("• " + qtyLabel(q,o[2]) + " de " + p.n + (o[0] ? " (" + o[0] + ")" : "") + " — " + money(q*o[1]));
  });
  $("#order").classList.toggle("hide", !keys.length);
  $("#oCount").textContent = keys.length + (keys.length === 1 ? " producto" : " productos");
  $("#oTotal").textContent = "Subtotal aprox. " + money(Math.round(total*100)/100);
  var msg = "¡Hola La Posta! 🐷 Quiero hacer este pedido:\n\n" + lines.join("\n") +
            "\n\nTotal aprox.: " + money(Math.round(total*100)/100) + "\n\nMi dirección de entrega es: ";
  $("#oSend").href = "https://wa.me/" + (TEST ? "" : WA) + "?text=" + encodeURIComponent(msg);
  lastMsg = msg;
}
</script>
</body>
</html>
