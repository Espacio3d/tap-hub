<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Posta · Recetas</title>
<meta name="description" content="Recetas guatemaltecas con los cortes de cerdo de La Posta. Pide tus cortes por WhatsApp hasta la puerta de tu casa.">
<meta name="theme-color" content="#F7AFAF">
<meta property="og:title" content="La Posta · Recetas">
<meta property="og:description" content="Recetas guatemaltecas con nuestros cortes de cerdo.">

<style>
:root{
  --pink:#F7AFAF; --pink-soft:#FDE8E8; --pink-deep:#E98A8A;
  --brown:#3B2622; --brown-2:#6B4E48; --cream:#FFFAF8; --line:#F1D6D3;
  --wa:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--cream);color:var(--brown);padding-bottom:40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}

/* ---------- Hero ---------- */
.hero{position:relative;background:var(--pink);padding:28px 16px 34px;text-align:center;overflow:hidden;border-radius:0 0 32px 32px}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.logo{width:104px;height:104px;border-radius:50%;background:#fff;margin:0 auto 10px;overflow:hidden;box-shadow:0 10px 30px rgba(59,38,34,.15);position:relative;z-index:1}
.logo img{width:100%;height:100%;object-fit:contain;padding:6px}
.hero .script{font-family:Allura,cursive;font-size:44px;line-height:1;position:relative;z-index:1}
.hero h1{font-size:26px;font-weight:700;letter-spacing:.06em;margin-top:-4px;position:relative;z-index:1}
.hero .sub{font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-top:6px;color:var(--brown-2);position:relative;z-index:1}

/* ---------- Views ---------- */
main{padding:18px 16px 0;max-width:980px;margin:0 auto}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.view-head h2{font-family:Allura,cursive;font-weight:400;font-size:38px;line-height:1}
.view-head .count{font-size:12px;color:var(--brown-2)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:99px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s;position:relative}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(59,38,34,.1)}}
.media{position:relative;aspect-ratio:4/5;background:radial-gradient(circle at 50% 60%,#fff 0%,var(--pink-soft) 70%);overflow:hidden;display:grid;place-items:center}
.media.short{aspect-ratio:1/1}
.media img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media img.cut{width:78%;height:66%;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(59,38,34,.18))}
.soon{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.85);padding:5px 9px;border-radius:99px}
.info{padding:10px 12px 12px}
.info h3{font-family:Allura,cursive;font-weight:400;font-size:26px;line-height:1.05}
.info p{font-size:12px;color:var(--brown-2);margin-top:4px}

/* Folder card: a tab on top and a recipe counter */
.folder{border-top-left-radius:6px}
.folder::before{content:"";position:absolute;top:0;left:0;width:44%;height:8px;background:var(--pink-deep);border-radius:0 0 10px 0;z-index:2}
.folder .info h3{font-family:Montserrat,sans-serif;font-size:14px;font-weight:600;line-height:1.25}
.folder .tag{position:absolute;top:16px;right:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--brown);color:#fff;padding:5px 8px;border-radius:99px;z-index:2}

/* ---------- Detail ---------- */
.veil{position:fixed;inset:0;background:rgba(59,38,34,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .3s ease;z-index:50;max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.sheet .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 12px 0;background:linear-gradient(var(--cream) 70%,transparent)}
.sheet .close button{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px;line-height:1}
.sheet .full{display:block;width:calc(100% - 32px);margin:0 16px;border-radius:18px;border:1px solid var(--line)}
.sheet .body{padding:16px 20px 24px}
.sheet h2{font-family:Allura,cursive;font-weight:400;font-size:40px;line-height:1}
.sheet .corte{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brown-2);margin-top:4px}
.sheet h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 6px}
.sheet ul,.sheet ol{padding-left:20px;font-size:14px;line-height:1.6}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:14px;text-decoration:none;margin-top:22px}

.media video.cutvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.corte-box{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.cb-media{position:relative;width:96px;height:120px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#fff 0%,var(--pink-soft) 70%);display:grid;place-items:center}
.cb-media video{width:100%;height:100%;object-fit:cover}
.cb-media img{width:86%;height:70%;object-fit:contain}
.cb-info{display:flex;flex-direction:column;gap:4px;font-size:14px}
.cb-info b{font-size:16px}
.cb-info span{color:var(--brown-2);font-size:13px}
footer{text-align:center;font-size:12px;color:var(--brown-2);padding:30px 16px 10px;line-height:1.7}
footer b{color:var(--brown)}
</style>
</head>

var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function findCorte(id){ return CORTES.filter(function(c){ return c.id === id; })[0]; }
/* Absolute paths: the page is also served at /la-posta/recetas, where relative paths would break. */
var BASE = "/demo-la-posta/";
function imgSrc(c, r){ return BASE + "recetas/img/" + c.id + "--" + r.id + ".webp"; }
function cutSrc(c){ return BASE + "fotos/" + c.foto + ".png"; }
/* Same short loop clips and posters the menu uses (videos/<foto>-card.mp4). */
var VER = "?v=8";
function cutVideo(c){
  return '<video class="cutvid" data-src="'+BASE+'videos/'+c.foto+'-card.mp4'+VER+'" poster="'+BASE+'videos/'+c.foto+'.jpg'+VER+'" muted loop playsinline preload="none"></video>';
}
/* Load a clip only when it gets near the screen; play only what is visible. */
var vLoader = new IntersectionObserver(function(es){
  es.forEach(function(e){ if (!e.isIntersecting) return; var v=e.target; v.src=v.dataset.src; v.load(); vLoader.unobserve(v); });
}, {rootMargin:"400px 0px"});
var vPlayer = new IntersectionObserver(function(es){
  es.forEach(function(e){ var v=e.target; if (e.isIntersecting && v.src) v.play().catch(function(){}); else v.pause(); });
}, {threshold:.5});
function wireVideos(root){
  root.querySelectorAll("video.cutvid").forEach(function(v){
    v.muted = true;
    v.addEventListener("loadeddata", function(){ var r=v.getBoundingClientRect(); if (r.top<innerHeight && r.bottom>0) v.play().catch(function(){}); });
    vLoader.observe(v); vPlayer.observe(v);
  });
}
function plural(n){ return n + (n === 1 ? " receta" : " recetas"); }

/* Recipe image when it exists; otherwise the cut photo with a "próximamente" tag. */
function recipeMedia(c, r){
  return '<div class="media"><img class="cut" loading="lazy" src="'+cutSrc(c)+'" alt=""><span class="soon">Imagen próximamente</span>' +
    '<img class="photo" loading="lazy" src="'+imgSrc(c, r)+'" alt="'+esc(r.n)+'" onload="var s=this.parentNode.querySelector(\'.soon\');if(s)s.remove()" onerror="this.remove()"></div>';
}

/* Home: one folder per cut that has recipes. */
function renderCortes(){
  var list = CORTES.filter(function(c){ return c.recetas.length; });
  $("#view").innerHTML =
    '<div class="view-head"><h2>Elige un corte</h2><span class="count">'+list.length+' cortes</span></div>' +
    '<div class="grid">' + list.map(function(c){
      return '<a class="card folder" href="#'+c.id+'" style="text-decoration:none">' +
        '<span class="tag">'+plural(c.recetas.length)+'</span>' +
        '<div class="media short">'+(c.video ? cutVideo(c) : '<img class="cut" loading="lazy" src="'+cutSrc(c)+'" alt="">')+'</div>' +
        '<div class="info"><h3>'+esc(c.n)+'</h3></div></a>';
    }).join("") + '</div>';
  wireVideos($("#view"));
}

/* Folder: the recipes of one cut. */
function renderCorte(c){
  $("#view").innerHTML =
    '<a class="back" href="#" style="text-decoration:none">← Todos los cortes</a>' +
    '<div class="view-head"><h2>'+esc(c.n)+'</h2><span class="count">'+plural(c.recetas.length)+'</span></div>' +
    '<div class="grid">' + c.recetas.map(function(r){
      return '<a class="card" href="#'+c.id+'/'+r.id+'" style="text-decoration:none">' + recipeMedia(c, r) +
        '<div class="info"><h3>'+esc(r.n)+'</h3><p>Corte: '+esc(c.n)+'</p></div></a>';
    }).join("") + '</div>';
}

function openSheet(c, r){
  var msg = "Hola La Posta, quiero pedir " + c.n + " para preparar " + r.n + ".";
  $("#sheet").innerHTML =
    '<div class="close"><button type="button" aria-label="Cerrar" id="x">×</button></div>' +
    '<img class="full" src="'+imgSrc(c, r)+'" alt="'+esc(r.n)+'" onerror="this.remove()">' +
    '<div class="body"><h2>'+esc(r.n)+'</h2><div class="corte">Corte: '+esc(c.n)+'</div>' +
    '<h4>Ingredientes</h4><ul>'+r.ing.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+'</ul>' +
    '<h4>Preparación</h4><ol>'+r.pasos.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+'</ol>' +
    '<h4>El corte que usas</h4><div class="corte-box"><div class="cb-media">'+(c.video ? cutVideo(c) : '<img src="'+cutSrc(c)+'" alt="">')+'</div>' +
    '<div class="cb-info"><b>'+esc(c.n)+'</b><span>'+esc(c.precio||"")+'</span></div></div>' +
    '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent(msg)+'">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>' +
    'Pedir este corte</a></div>';
  $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("on"); $("#veil").classList.add("on");
  $("#x").onclick = closeSheet;
  /* a single clip here, so load it right away (the sheet scrolls on its own) */
  $("#sheet").querySelectorAll("video.cutvid").forEach(function(v){ v.muted = true; v.src = v.dataset.src; v.play().catch(function(){}); });
}
function hideSheet(){ $("#sheet").classList.remove("on"); $("#veil").classList.remove("on"); $("#sheet").querySelectorAll("video").forEach(function(v){ v.pause(); }); }
function closeSheet(){ location.hash = location.hash.slice(1).split("/")[0]; }

/* Routes: #  ·  #<corte>  ·  #<corte>/<receta>  (so a cut or recipe can be shared by link) */
var current = null;
function route(){
  var parts = decodeURIComponent(location.hash.slice(1)).split("/");
  var c = findCorte(parts[0]);
  var r = c && c.recetas.filter(function(x){ return x.id === parts[1]; })[0];
  var key = c ? c.id : "";
  if (key !== current){
    current = key;
    if (c) renderCorte(c); else renderCortes();
    if (!r) window.scrollTo(0, c ? $("#view").offsetTop - 10 : 0);
  }
  if (r) openSheet(c, r); else hideSheet();
}
window.addEventListener("hashchange", route);
$("#veil").onclick = closeSheet;
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet(); });
route();
</script>
</body>
</html>
