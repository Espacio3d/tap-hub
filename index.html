<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Montserrat:wght@500;600;700&family=Bebas+Neue&family=Fraunces:wght@600;700&family=Quicksand:wght@500;600;700&family=Oswald:wght@500;600;700&family=Abril+Fatface&family=DM+Serif+Display&family=Righteous&family=Pacifico&family=Caveat:wght@600;700&display=swap">

<style id="app-style">
  :root{
    --bg:#F6F5F2;
    --surface:#FFFFFF;
    --surface-edge:#E6E3DB;
    --text:#181C1B;
    --text-dim:#666F6C;
    --accent-default:#0E7A5F;
    --accent-ink:#FFFFFF;
    --danger:#C24A3B;
    --chip-bg:#EFEDE6;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121615;
      --surface:#1C2120;
      --surface-edge:#2B3230;
      --text:#EEF1EF;
      --text-dim:#9AA5A1;
      --accent-default:#2FD1A4;
      --accent-ink:#0B1413;
      --danger:#E17A6B;
      --chip-bg:#242B29;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121615;
    --surface:#1C2120;
    --surface-edge:#2B3230;
    --text:#EEF1EF;
    --text-dim:#9AA5A1;
    --accent-default:#2FD1A4;
    --accent-ink:#0B1413;
    --danger:#E17A6B;
    --chip-bg:#242B29;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:var(--bg-img, none); background-size:cover; background-position:center; background-repeat:no-repeat; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    padding-inline:16px;
    padding-block:28px;
  }
  h1,h2,h3{ font-family:"Outfit",-apple-system,sans-serif; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  input,select{ font-family:inherit; }
  img{ max-width:100%; }

  #app{ max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }

  /* ---- shared bits ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:12px; padding:12px 18px;
    font-size:15px; font-weight:600; cursor:pointer;
    font-family:"Outfit",sans-serif;
  }
  .btn-primary{ background:var(--accent, var(--accent-default)); color:var(--accent-ink); }
  .btn-ghost{ background:var(--chip-bg); color:var(--text); }
  .btn-danger{ background:transparent; color:var(--danger); }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:9px; }
  .btn:active{ transform:translateY(1px); }
  .icon{ width:18px; height:18px; flex:0 0 auto; }
  .icon path, .icon circle, .icon rect{ stroke:currentColor; }

  /* ================= ADMIN ================= */
  .admin-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .admin-header h1{ color:var(--panel-text, var(--text)); }
  .admin-header p{ color:var(--panel-text, var(--text-dim)); }

  .client-card{
    background:var(--surface); border:1px solid var(--surface-edge); border-radius:16px;
    padding:16px; display:flex; align-items:center; gap:12px;
  }
  .client-avatar{
    width:44px; height:44px; border-radius:12px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; font-family:"Outfit",sans-serif;
    overflow:hidden;
  }
  .client-meta{ flex:1; min-width:0; }
  .client-meta .name{ font-weight:600; font-size:15px; }
  .client-meta .slug{ color:var(--text-dim); font-size:13px; font-family:monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .client-actions{ display:flex; gap:6px; flex:0 0 auto; }

  .empty{
    text-align:center; color:var(--text-dim); font-size:14px;
    padding-block:32px; border:1px dashed var(--surface-edge); border-radius:16px;
  }

  /* ---- form ---- */
  .form-card{
    background:var(--surface); border:1px solid var(--surface-edge); border-radius:16px;
    padding:20px; display:flex; flex-direction:column; gap:16px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; font-weight:600; color:var(--text-dim); }
  .field input[type="text"], .field input[type="url"]{
    background:var(--bg); border:1px solid var(--surface-edge); border-radius:10px;
    padding:10px 12px; font-size:15px; color:var(--text);
  }
  .row2{ display:flex; gap:12px; }
  .row2 .field{ flex:1; min-width:0; }
  .color-field{ display:flex; align-items:center; gap:10px; }
  .color-field input[type="color"]{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--surface-edge); padding:2px; background:var(--bg);
  }

  .buttons-editor{ display:flex; flex-direction:column; gap:10px; }
  .button-row{
    display:flex; flex-direction:column; gap:6px;
    background:var(--bg); border:1px solid var(--surface-edge); border-radius:12px; padding:8px;
  }
  .button-row-main{ display:flex; gap:8px; align-items:center; }
  .button-row-icon-upload{
    display:flex; align-items:center; gap:8px; padding-left:38px;
    font-size:12px; color:var(--text-dim);
  }
  .button-row-icon-upload input[type="file"]{
    font-size:11px; background:none; border:none; padding:0; color:var(--text-dim); flex:none;
  }
  .button-row select{
    background:var(--surface); border:1px solid var(--surface-edge); border-radius:8px;
    padding:8px; font-size:13px; color:var(--text); flex:0 0 auto; width:120px;
  }
  .button-row input{
    background:var(--surface); border:1px solid var(--surface-edge); border-radius:8px;
    padding:8px 10px; font-size:13px; color:var(--text); min-width:0;
  }
  .button-row .label-input{ flex:1; }
  .button-row .url-input{ flex:1.4; }
  .button-row .row-color{
    flex:0 0 auto; width:30px; height:30px; padding:2px; border-radius:8px;
    border:1px solid var(--surface-edge); background:var(--surface);
  }
  .row-remove{
    flex:0 0 auto; width:30px; height:30px; border-radius:8px; border:none;
    background:transparent; color:var(--danger); font-size:16px; cursor:pointer;
  }
  .add-row-btn{ align-self:flex-start; }

  .form-actions{ display:flex; gap:10px; justify-content:flex-end; padding-top:4px; border-top:1px solid var(--surface-edge); }

  .link-box{
    display:flex; align-items:center; gap:8px; background:var(--chip-bg);
    border-radius:10px; padding:8px 10px; font-size:12px; font-family:monospace;
    overflow:hidden;
  }
  .link-box span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .qr-box{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding-top:8px;
  }
  .qr-box canvas{ border-radius:10px; border:1px solid var(--surface-edge); }
  .templates-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg); border:1px solid var(--surface-edge); border-radius:10px;
    padding:8px 12px; font-size:13px;
  }
  .template-swatch{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--surface-edge);
    color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .template-swatch:hover{ outline:2px solid var(--accent-default); outline-offset:2px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:50;
  }
  .toast.show{ opacity:1; }

  /* ================= PUBLIC HUB ================= */
  .hub{ display:flex; flex-direction:column; gap:20px; align-items:center; padding-top:8px; font-family:var(--hub-font, inherit); }
  .hub-avatar{
    width:76px; height:76px; border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:700; color:var(--accent-ink);
    background:var(--accent, var(--accent-default));
    overflow:hidden;
  }
  .hub h1{ font-size:24px; text-align:center; font-family:var(--hub-font, "Outfit"), -apple-system, sans-serif; color:var(--hub-text, var(--text)); }
  .hub .tagline{ color:var(--hub-text, var(--text-dim)); font-size:14px; text-align:center; margin-top:-8px; }
  .hub-links{ width:100%; display:flex; flex-direction:column; gap:10px; }
  .hub-link{
    display:flex; align-items:center; gap:12px;
    background:var(--hub-card, var(--surface)); border:1px solid var(--surface-edge); border-radius:14px;
    padding:15px 16px; text-decoration:none; color:var(--hub-card-text, var(--text)); font-weight:500; font-size:15px;
  }
  .hub-link .icon-badge{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--chip-bg); color:var(--accent, var(--accent-default));
  }
  .hub-link .chev{ margin-left:auto; color:var(--hub-card-text, var(--text-dim)); width:16px; height:16px; }
  .hub-footer{ color:var(--text-dim); font-size:12px; text-align:center; padding-top:8px; }
  .capture-box{
    width:100%; background:var(--surface); border:1px solid var(--surface-edge); border-radius:14px;
    padding:14px 16px; display:flex; flex-direction:column; gap:8px; font-size:13px; color:var(--text-dim);
  }
  .capture-row{ display:flex; gap:8px; }
  .capture-row input{
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--surface-edge); border-radius:10px;
    padding:10px 12px; font-size:14px; color:var(--text);
  }
  .hub-footer a{ color:inherit; }
  .not-found{ text-align:center; padding-block:60px; color:var(--text-dim); }

  .login-footer{ display:flex; justify-content:flex-end; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

    game:      '<rect x="2.5" y="8" width="19" height="9" rx="4" stroke-width="1.6" fill="none"/><path d="M7 10.5v4M5 12.5h4" stroke-width="1.5" stroke-linecap="round"/><circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="18.2" cy="13.2" r="1" fill="currentColor" stroke="none"/>',
    offer:     '<path d="M20 12.2 12.6 20l-9-9L4 4l7 .4z" stroke-width="1.6" stroke-linejoin="round" fill="none"/><circle cx="8.3" cy="8.3" r="1.4" stroke-width="1.4" fill="none"/>',

    survey:    '<rect x="4" y="3" width="16" height="18" rx="2" stroke-width="1.6" fill="none"/><path d="M8 8h8M8 12l1.6 1.6L12.5 10M8 16h5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',

  };
  var ICON_LABELS = {
    menu:"Menú", review:"Reseña", wifi:"WiFi", rewards:"Recompensas", app:"Descargar app",
    giftcard:"Gift card", instagram:"Instagram", facebook:"Facebook", linkedin:"LinkedIn", recetario:"Recetario", website:"Sitio web",
    calendar:"Reservar/Agendar", phone:"Llamar", game:"Juego", offer:"Ofertas", whatsapp:"WhatsApp",
    survey:"Encuesta", support:"Servicio al cliente", contact:"Contacto"
  };

  var FONTS = {
    default:    { label:"Predeterminada", css:null },
    poppins:    { label:"Poppins", css:"'Poppins',sans-serif" },
    playfair:   { label:"Playfair Display (elegante)", css:"'Playfair Display',serif" },
    montserrat: { label:"Montserrat", css:"'Montserrat',sans-serif" },
    bebas:      { label:"Bebas Neue (grande y bold)", css:"'Bebas Neue',sans-serif" },
    fraunces:   { label:"Fraunces (con carácter)", css:"'Fraunces',serif" },
    quicksand:  { label:"Quicksand (redondeada)", css:"'Quicksand',sans-serif" },
    oswald:     { label:"Oswald (condensada)", css:"'Oswald',sans-serif" },
    abril:      { label:"Abril Fatface (dramática)", css:"'Abril Fatface',serif" },
    dmserif:    { label:"DM Serif Display (elegante)", css:"'DM Serif Display',serif" },
    righteous:  { label:"Righteous (divertida)", css:"'Righteous',sans-serif" },
    pacifico:   { label:"Pacifico (manuscrita casual)", css:"'Pacifico',cursive" },
    caveat:     { label:"Caveat (manuscrita)", css:"'Caveat',cursive" }
  };

  var TEMPLATES = [
    { key:"clasico",    label:"Clásico verde",    accent:"#0E7A5F", font:"default" },
    { key:"nocturno",   label:"Elegante nocturno", accent:"#C9A227", font:"playfair" },

    { key:"corporativo",label:"Corporativo azul",  accent:"#1D4ED8", font:"montserrat" },
    { key:"rustico",    label:"Rústico cálido",    accent:"#B5651D", font:"fraunces" }
  ];

  function svgIcon(key, cls){
    return '<svg class="'+(cls||'icon')+'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'+(ICONS[key]||ICONS.website)+'</svg>';
  }

  /* ============================================================
     DATA LAYER — talks to Supabase (Postgres + Auth). Real security
     lives in the database's Row Level Security policies (anyone can
     read, only a logged-in user can write) — this file never has to
     enforce that itself, it just reflects whatever the DB allows.
     ============================================================ */
  var SUPABASE_URL = "https://oifgcicvnrodipjfjkso.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pZmdjaWN2bnJvZGlwamZqa3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTQ3OTksImV4cCI6MjEwNTg3MDc5OX0.rkGZ2UQhgqcFns4KpHocYXFbh5o5cgFhOV68OIwyNBQ";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var Storage = {
    load: async function(){
      var res = await sb.from('clients').select('*').order('created_at');
      if(res.error){ console.error(res.error); toast('No se pudieron cargar los clientes'); return []; }
      return res.data;
    },
    loadOne: async function(slug){
      var res = await sb.from('clients').select('*').eq('slug', slug).maybeSingle();
      if(res.error){ console.error(res.error); return null; }
      return res.data;
    },
    upsert: async function(client){
      var res = await sb.from('clients').upsert(client, {onConflict:'slug'});
      if(res.error) throw res.error;
    },
    bulkUpsert: async function(clientsArray){
      var res = await sb.from('clients').upsert(clientsArray, {onConflict:'slug'});
      if(res.error) throw res.error;
    },
    remove: async function(slug){
      var res = await sb.from('clients').delete().eq('slug', slug);
      if(res.error) throw res.error;
    },
    uploadLogo: async function(file, slugHint){
      var ext = (file.name.split('.').pop() || 'png').toLowerCase();
      var path = (slugHint || 'logo') + '-' + Date.now() + '.' + ext;
      var res = await sb.storage.from('logos').upload(path, file, { upsert: true });
      if(res.error) throw res.error;
      var pub = sb.storage.from('logos').getPublicUrl(path);
      return pub.data.publicUrl;
    },
    loadPanelSettings: async function(){
      for(var attempt=0; attempt<3; attempt++){
        var res = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle();
        if(!res.error){ return res.data || { background: '' }; }
        console.error(res.error);
        if(attempt < 2){ await new Promise(function(resolve){ setTimeout(resolve, 500); }); }
      }
      return { background: '' };
    },

      var clicks = {};

        clicks[k] = (clicks[k]||0) + 1;
      });
      var devices = {};
      rows.filter(function(r){ return r.type==='view'; }).forEach(function(r){
        var k = r.device || 'desconocido';
        devices[k] = (devices[k]||0) + 1;
      });
      return { views: views, clicks: clicks, devices: devices, leads: leads.data || [], recent: rows.slice(0,25) };
    },

  function slugify(s){
    return (s||'').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48) || 'cliente';
  }

  function uniqueSlug(base, clients, ignoreSlug){
    var s = slugify(base), n = 2;
    while(clients.some(function(c){ return c.slug===s && c.slug!==ignoreSlug; })){
      s = slugify(base)+'-'+n; n++;
    }
    return s;
  }

  function parseCsvLine(line){
    var result = [], cur = '', inQuotes = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(inQuotes){
        if(ch === '"'){
          if(line[i+1] === '"'){ cur += '"'; i++; }
          else { inQuotes = false; }
        } else { cur += ch; }
      } else {
        if(ch === '"'){ inQuotes = true; }
        else if(ch === ','){ result.push(cur); cur = ''; }
        else { cur += ch; }
      }
    }
    result.push(cur);
    return result;
  }

  function parseClientsCsv(text, existingClients){
    var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length; });
    if(!lines.length) return [];
    var header = parseCsvLine(lines[0]).map(function(h){ return h.trim().toLowerCase(); });
    var idx = {};
    header.forEach(function(h,i){ idx[h] = i; });
    var out = [];
    var working = existingClients.slice();
    for(var i=1;i<lines.length;i++){
      var cols = parseCsvLine(lines[i]);
      var name = (cols[idx.name]||'').trim();
      if(!name) continue;
      var buttonsRaw = (cols[idx.buttons]||'').trim();
      var buttons = buttonsRaw ? buttonsRaw.split(';').map(function(part){
        var p = part.split('|');
        return { icon:(p[0]||'website').trim(), label:(p[1]||'').trim(), url:(p[2]||'').trim(), color:'', iconImage:'' };
      }).filter(function(b){ return b.label && b.url; }) : [];
      if(!buttons.length) buttons = [{icon:'website',label:'Sitio web',url:'https://',color:'',iconImage:''}];
      var slug = uniqueSlug(name, working);
      var newClient = {
        slug: slug, name: name,
        tagline: (cols[idx.tagline]||'').trim(),
        phone: (cols[idx.phone]||'').trim(),
        accent: (cols[idx.accent]||'').trim() || '#0E7A5F',
        logo: name.slice(0,1).toUpperCase(),
        background: '',
        font: (cols[idx.font]||'').trim() || 'default',
        buttons: buttons,
        capture_leads: false, capture_type: 'email',
        whatsapp_enabled: false, save_contact_enabled: false
      };
      out.push(newClient);
      working.push(newClient);
    }
    return out;
  }

  function isImageUrl(s){
    return /^https?:\/\//i.test(s||'');
  }

  function contrastTextColor(hex){
    var h = (hex||'').replace('#','');
    if(h.length === 3){ h = h.split('').map(function(c){ return c+c; }).join(''); }
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    if(isNaN(r) || isNaN(g) || isNaN(b)) return '';
    var brightness = (r*299 + g*587 + b*114) / 1000;
    return brightness >= 150 ? '#181C1B' : '#FFFFFF';
  }

  function logoInner(logo){
    if(isImageUrl(logo)){
      return '<img src="'+escapeHtml(logo)+'" alt="" style="width:100%;height:100%;object-fit:contain;">';
    }
    return escapeHtml(logo||'•');
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toast._h);

  }

      if(!ok) return;
      try{
        await Storage.resetStats(client.slug);
        toast('Estadísticas reiniciadas');
        renderStats(client, clients, settings);
      }catch(err){
        toast('No se pudo reiniciar: '+(err && err.message ? err.message : 'error'));
      }
    };
  }

  /* ---------------- LOYALTY (TARJETA DE SELLOS) VIEW ----------------
     Only the admin sees this. Business clients never get panel
     access: they only receive their caja link + PIN (sent by
     WhatsApp from here). All rules are enforced by the database

      var r3 = await sb.from('loyalty_redemptions').select('id', { count:'exact', head:true }).eq('client_slug', client.slug);
      var r4 = await sb.from('loyalty_stamps').select('via,suspicious,note,distance_m,created_at,loyalty_customers(name,phone)')

      stats.customers = r1.count || 0;
      stats.stamps = r2.count || 0;
      stats.redemptions = r3.count || 0;

    var site = location.origin + '/';   // /:slug/sello and /caja/:token are root routes (vercel.json)

          '<p style="margin:0;font-size:12px;color:var(--text-dim);">Si lo dejas vacío se usa el mensaje de ejemplo.</p>'+
        '</div>'+
      '</div>'+

      '<div class="form-card">'+
        '<h3 style="font-size:16px;">Diseño de la tarjeta</h3>'+
        '<p style="margin:0;font-size:12px;color:var(--text-dim);">Lo que marques como "Igual que la página" usa el diseño de la página del negocio.</p>'+
        '<div id="d-preview"></div>'+
        '<div class="field"><label>Texto bajo el nombre</label><input type="text" id="d-subtitle" maxlength="60" value="'+escapeHtml(design.subtitle||'')+'" placeholder="Tarjeta de sellos"></div>'+
        '<div class="field"><label>Ícono de los sellos (emoji o imagen)</label>'+
          '<div class="row2"><input type="text" id="d-icon" value="'+escapeHtml(isImageUrl(design.stamp_icon) ? '' : (design.stamp_icon||''))+'" placeholder="✓ (vacío = palomita)" maxlength="8">'+
          '<input type="file" id="d-icon-file" accept="image/png,image/jpeg,image/webp" style="font-size:12px;min-width:0;max-width:100%;flex:1;"></div>'+
          '<input type="hidden" id="d-icon-img" value="'+escapeHtml(isImageUrl(design.stamp_icon) ? design.stamp_icon : '')+'">'+
          '<div class="templates-row" id="d-emojis">'+['☕','🍕','🍔','🌮','🍦','🍺','🥩','🐷','💈','✂️','💅','⭐','❤️','🎁'].map(function(e){
            return '<button class="btn btn-ghost btn-sm" type="button" data-emoji="'+e+'" style="font-size:18px;padding:6px 9px;">'+e+'</button>';
          }).join('')+'</div>'+
          '<button class="btn btn-danger btn-sm" id="d-icon-clear" type="button" style="align-self:flex-start;">Quitar ícono (usar palomita)</button>'+
        '</div>'+
        '<div class="row2">'+
          '<div class="field"><label>Forma de los sellos</label><select id="d-shape">'+
            [['circle','Círculo'],['rounded','Redondeado'],['square','Cuadrado']].map(function(o){
              return '<option value="'+o[0]+'"'+((design.shape||'circle')===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+
          '</select></div>'+
          '<div class="field"><label>Sellos vacíos</label><select id="d-empty">'+

        '</div>'+
        designColorField('d-accent', 'Color principal (botones y sellos)', design.accent, client.accent || '#0E7A5F')+
        designColorField('d-card', 'Color de los cuadros', design.card_color, client.card_color || '#FFFFFF')+
        designColorField('d-text', 'Color del nombre y texto de arriba', design.text_color, client.text_color || '#181C1B')+
        '<div class="field"><label>Fondo</label>'+
          chk('d-bg-auto', !design.bg, 'Igual que la página')+
          '<div id="d-bg-box" class="row2" style="'+(design.bg?'':'display:none;')+'">'+
            '<input type="color" id="d-bg-color" value="'+escapeHtml(design.bg && !isImageUrl(design.bg) ? design.bg : '#F6F5F2')+'" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--surface-edge);padding:2px;">'+
            '<input type="file" id="d-bg-file" accept="image/png,image/jpeg,image/webp" style="font-size:12px;min-width:0;max-width:100%;flex:1;">'+
          '</div>'+
          '<input type="hidden" id="d-bg-img" value="'+escapeHtml(isImageUrl(design.bg) ? design.bg : '')+'">'+
          '<button class="btn btn-danger btn-sm" id="d-bg-img-clear" type="button" style="align-self:flex-start;'+(isImageUrl(design.bg)?'':'display:none;')+'">Quitar imagen de fondo</button>'+
        '</div>'+
        '<div class="field"><label>Letra de los títulos</label><select id="d-font">'+
          '<option value="">Igual que la página</option>'+
          Object.keys(FONTS).filter(function(k){ return k !== 'default'; }).map(function(k){

        '<div class="row2">'+
          '<div class="field"><label>Latitud</label><input type="text" id="l-lat" value="'+(prog.lat==null?'':prog.lat)+'" placeholder="14.6349"></div>'+
          '<div class="field"><label>Longitud</label><input type="text" id="l-lng" value="'+(prog.lng==null?'':prog.lng)+'" placeholder="-90.5069"></div>'+
        '</div>'+
        '<div class="row2">'+
          '<div class="field"><label>Radio permitido (metros)</label><input type="text" inputmode="numeric" id="l-radius" value="'+prog.geo_radius_m+'"></div>'+
          '<div class="field"><label>&nbsp;</label><button class="btn btn-ghost btn-sm" id="l-here" type="button">📍 Usar mi ubicación actual</button></div>'+
        '</div>'+
        '<p style="color:var(--text-dim);font-size:12px;margin:0;">Tip: pon la ubicación estando dentro del negocio, o cópiala de Google Maps (clic derecho → coordenadas).</p>'+
      '</div>'+

      '<div class="form-card">'+
        '<h3 style="font-size:16px;">Protección del sticker NFC</h3>'+
        chk('l-ctr', prog.nfc_require_counter, 'Exigir contador NFC (solo si TODOS los stickers de este negocio tienen el "mirror" de UID + contador activado)')+
        '<p style="color:var(--text-dim);font-size:12px;margin:0;">Si no estás seguro, déjalo apagado: el bloqueo por horas sigue funcionando igual.</p>'+
        '<div class="form-actions">'+
          '<button class="btn btn-ghost" id="loyBackBtn" type="button">Volver</button>'+
          '<button class="btn btn-primary" id="loySaveBtn" type="button">Guardar</button>'+
        '</div>'+
      '</div>'+

      (isNew ? '<div class="form-card"><p style="margin:0;color:var(--text-dim);">Guarda primero para generar los enlaces, el PIN y la caja.</p></div>' :
      '<div class="form-card">'+
        '<h3 style="font-size:16px;">Enlaces para grabar e imprimir</h3>'+
        linkRow('Enlace para el sticker NFC (grábalo con NFC Tools)', nfcUrl)+
        linkRow('Enlace para el QR impreso', qrUrl)+
        '<div class="qr-box"><div id="loyQr" style="width:140px;height:140px;"></div>'+
          '<button class="btn btn-ghost btn-sm" id="loyQrBtn" type="button">Descargar QR</button></div>'+
        linkRow('Enlace corto (para escribirlo a mano, WhatsApp o inicio — NO sella solo)', cardUrl)+
      '</div>'+

      '<div class="form-card">'+
        '<h3 style="font-size:16px;">Caja del negocio</h3>'+
        '<div class="field"><label>PIN de caja (4 a 8 números) '+(prog.caja_pin_hash ? '— ya hay uno puesto ✓' : '— todavía no hay PIN')+'</label>'+
          '<div class="row2"><input type="text" inputmode="numeric" id="l-pin" maxlength="8" placeholder="Nuevo PIN" autocomplete="off">'+
          '<button class="btn btn-ghost btn-sm" id="l-pin-save" type="button">Guardar PIN</button></div>'+
          '<p style="color:var(--text-dim);font-size:12px;margin:0;">Cambiar el PIN desconecta todos los celulares de caja.</p></div>'+
        (cajaUrl ? linkRow('Enlace de caja (secreto — solo para el negocio)', cajaUrl) : '<p style="margin:0;color:var(--text-dim);font-size:13px;">Todavía no hay enlace de caja.</p>')+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
          '<button class="btn btn-ghost btn-sm" id="l-caja-new" type="button">'+(cajaUrl ? '🔄 Regenerar enlace (el viejo deja de servir)' : '➕ Generar enlace de caja')+'</button>'+
          (cajaUrl ? '<button class="btn btn-ghost btn-sm" id="l-caja-wa" type="button">📲 Mandar por WhatsApp</button>' : '')+
        '</div>'+
      '</div>'+

    /* ---- Diseño de la tarjeta: read form → design object, live preview ---- */
    function readDesign(){
      function v(id){ return document.getElementById(id).value; }
      function color(id){ return document.getElementById(id+'-auto').checked ? '' : v(id); }
      var bgAuto = document.getElementById('d-bg-auto').checked;
      var out = {
        subtitle: v('d-subtitle').trim(),
        stamp_icon: v('d-icon-img') || v('d-icon').trim(),
        shape: v('d-shape'),
        empty_style: v('d-empty'),
        accent: color('d-accent'),
        card_color: color('d-card'),
        text_color: color('d-text'),
        bg: bgAuto ? '' : (v('d-bg-img') || v('d-bg-color')),
        font: v('d-font')
      };
      Object.keys(out).forEach(function(k){ if(!out[k] || out[k] === 'circle' || out[k] === 'number') delete out[k]; });
      return out;
    }
    function updatePreview(){
      var d = readDesign();
      var accent = d.accent || client.accent || '#0E7A5F';
      var bg = d.bg || client.background || '#F6F5F2';
      var card = d.card_color || client.card_color || '#FFFFFF';
      var cardText = contrastTextColor(card) || '#181C1B';
      var head = d.text_color || client.text_color || (isImageUrl(bg) ? '#FFFFFF' : (contrastTextColor(bg) || '#181C1B'));
      var fontKey = d.font || client.font;
      var font = (FONTS[fontKey] && FONTS[fontKey].css) || "'Outfit',sans-serif";
      var radius = d.shape === 'square' ? '4px' : (d.shape === 'rounded' ? '10px' : '50%');
      var icon = d.stamp_icon ? (isImageUrl(d.stamp_icon)
        ? '<img src="'+escapeHtml(d.stamp_icon)+'" style="width:70%;height:70%;object-fit:contain;">'
        : '<span style="font-size:20px;">'+escapeHtml(d.stamp_icon)+'</span>') : '✓';
      var dots = '';
      for(var i = 0; i < 8; i++){
        var on = i < 4;
        var faded = !on && d.empty_style === 'faded' && d.stamp_icon;
        dots += '<div style="width:40px;height:40px;border-radius:'+radius+';display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;font-size:12px;'+
          (on ? 'background:'+accent+';color:'+(contrastTextColor(accent)||'#fff')+';' : 'border:2px dashed '+cardText+'33;color:'+cardText+'88;')+'">'+
          (on ? icon : (faded ? '<span style="opacity:.28;filter:grayscale(1);display:flex;align-items:center;justify-content:center;width:100%;height:100%;">'+icon+'</span>' : (i+1)))+'</div>';
      }
      var bgCss = isImageUrl(bg) ? 'background:url(\''+bg.replace(/'/g,'%27')+'\') center/cover;' : 'background:'+bg+';';
      document.getElementById('d-preview').innerHTML =
        '<div style="'+bgCss+'border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--surface-edge);">'+
          '<div style="text-align:center;color:'+head+';">'+
            '<div style="width:48px;height:48px;border-radius:14px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px;background:'+accent+';overflow:hidden;">'+logoInner(client.logo)+'</div>'+
            '<div style="font-family:'+font+';font-size:20px;font-weight:700;">'+escapeHtml(client.name)+'</div>'+
            '<div style="font-size:12px;opacity:.75;">'+escapeHtml(d.subtitle || 'Tarjeta de sellos')+'</div>'+
          '</div>'+
          '<div style="background:'+card+';color:'+cardText+';border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;">'+
            '<div style="display:flex;justify-content:space-between;font-size:13px;"><span>Hola, <b>María</b></span><b style="font-family:'+font+';font-size:18px;">4/8</b></div>'+
            '<div style="display:grid;grid-template-columns:repeat(4,40px);gap:8px;justify-content:center;">'+dots+'</div>'+
            '<div style="background:'+accent+';color:'+(contrastTextColor(accent)||'#fff')+';border-radius:10px;padding:9px;text-align:center;font-family:'+font+';font-weight:600;font-size:14px;">Botón de ejemplo</div>'+
          '</div>'+
        '</div>';
    }
    ['d-subtitle','d-icon','d-shape','d-empty','d-accent','d-card','d-text','d-bg-color','d-font'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePreview);
      document.getElementById(id).addEventListener('change', updatePreview);
    });
    ['d-accent','d-card','d-text'].forEach(function(id){
      document.getElementById(id+'-auto').addEventListener('change', function(){
        document.getElementById(id).style.display = this.checked ? 'none' : '';
        updatePreview();
      });
    });

    async function uploadDesignImage(file, hiddenId, label){

    document.getElementById('d-bg-file').addEventListener('change', async function(e){

    document.getElementById('d-bg-img-clear').onclick = function(){

    document.getElementById('l-here').onclick = function(){

        document.getElementById('l-lat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('l-lng').value = pos.coords.longitude.toFixed(6);
        toast('Ubicación puesta (precisión ~'+Math.round(pos.coords.accuracy)+' m) — guarda para confirmar');

    document.getElementById('loySaveBtn').onclick = async function(){

        reward: document.getElementById('l-reward').value.trim(),
        ask_email: document.getElementById('l-email').checked,
        require_geo_qr: document.getElementById('l-geo').checked,
        lat: num('l-lat'),
        lng: num('l-lng'),
        geo_radius_m: num('l-radius'),
        nfc_require_counter: document.getElementById('l-ctr').checked,
        design: readDesign(),
        caja_promos: document.getElementById('l-caja-promos').checked,
        birthday_msg: document.getElementById('l-bday-msg').value.trim() || null,
        updated_at: new Date().toISOString()
      };
      if(!(row.stamps_needed >= 1 && row.stamps_needed <= 50)){ toast('Los sellos deben ser entre 1 y 50'); return; }
      if(!(row.cooldown_hours >= 0 && row.cooldown_hours <= 720)){ toast('Las horas de bloqueo deben ser entre 0 y 720'); return; }
      if(!row.reward){ toast('Escribe el premio'); return; }
      if(row.lat != null && !(row.lat >= -90 && row.lat <= 90)){ toast('Latitud no válida'); return; }
      if(row.lng != null && !(row.lng >= -180 && row.lng <= 180)){ toast('Longitud no válida'); return; }
      if(!(row.geo_radius_m >= 20)){ row.geo_radius_m = 150; }
      if(row.require_geo_qr && (row.lat == null || row.lng == null)){ toast('Para exigir ubicación, pon la latitud y longitud del negocio'); return; }
      var res = await sb.from('loyalty_programs').upsert(row, { onConflict:'client_slug' });
      if(res.error){ console.error(res.error); toast('No se pudo guardar: '+res.error.message); return; }
      toast('Guardado');
      renderLoyalty(client, clients, settings);

    document.getElementById('l-promos').onclick = function(){ renderPromos(client, clients, settings, prog); };

    if(window.QRCode){
      new QRCode(document.getElementById('loyQr'), { text: qrUrl, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M });

    document.getElementById('loyQrBtn').onclick = function(){
      var canvas = document.querySelector('#loyQr canvas');
      if(!canvas){ toast('El QR todavía está cargando, intenta de nuevo'); return; }

      a.download = client.slug + '-sellos-qr.png';
      a.href = canvas.toDataURL('image/png');

    document.getElementById('l-pin-save').onclick = async function(){

      var res = await sb.rpc('loyalty_admin_set_pin', { p_slug: client.slug, p_pin: pin });
      if(res.error){ console.error(res.error); toast('No se pudo guardar el PIN: '+res.error.message); return; }

    document.getElementById('l-caja-new').onclick = async function(){

      var res = await sb.rpc('loyalty_admin_new_caja_link', { p_slug: client.slug });
      if(res.error){ console.error(res.error); toast('No se pudo generar: '+res.error.message); return; }
      toast('Enlace de caja listo');
      renderLoyalty(client, clients, settings);
    };

    if(document.getElementById('l-caja-wa')){
      document.getElementById('l-caja-wa').onclick = function(){
        var msg = 'Hola 👋 Este es el acceso de CAJA de la tarjeta de sellos de '+client.name+':\n'+cajaUrl+
          '\n\nGuárdalo en el celular de la caja (Compartir → Agregar a inicio). Te pedirá el PIN una sola vez. No lo compartas.';
        var phone = (client.phone || '').replace(/[^0-9]/g, '');
        window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg), '_blank');
      };

    document.getElementById('l-advanced').onclick = function(){
      var box = document.getElementById('l-danger');

    };

    if(document.getElementById('l-delete')){
      document.getElementById('l-delete').onclick = async function(){
        // Double confirmation: a yes/no dialog, then typing the exact slug.
        if(!confirm('¿Borrar para siempre la tarjeta de sellos de "'+client.name+'"?\n\nSe borran '+stats.customers+' clientes, '+stats.stamps+' sellos y '+stats.redemptions+' canjes. No se puede deshacer.')) return;
        var typed = prompt('Para confirmar, escribe exactamente: '+client.slug);
        if(typed === null) return;
        if(typed.trim() !== client.slug){ toast('No coincide. No se borró nada.'); return; }
        var res = await sb.from('loyalty_programs').delete().eq('client_slug', client.slug).eq('enabled', false);
        if(res.error){ console.error(res.error); toast('No se pudo borrar: '+res.error.message); return; }
        toast('Tarjeta de sellos borrada');
        renderAdmin(clients, settings);
      };
    }

    document.getElementById('l-export').onclick = async function(){
      var res = await sb.from('loyalty_customers')
        .select('name,phone,birthday,email,marketing_ok,balance,total_stamps,last_stamp_at,created_at')
        .eq('client_slug', client.slug).order('created_at');
      if(res.error){ toast('No se pudo exportar'); return; }
      var cols = ['name','phone','birthday','email','marketing_ok','balance','total_stamps','last_stamp_at','created_at'];

      var csv = head.join(',') + '\n' + res.data.map(function(r){
        return cols.map(function(k){ var v = r[k] == null ? '' : String(r[k]); return '"' + v.replace(/"/g, '""') + '"'; }).join(',');
      }).join('\n');
      var blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });

      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    };

  /* ---------------- PROMOCIONES (WHATSAPP) VIEW ----------------
     Free, semi-automatic campaigns: write one message, filter the
     customers who accepted promotions, and send it one by one — each
     "Enviar" opens WhatsApp with the text already personalised. Only
     customers with marketing_ok = true are ever listed. */
  async function renderPromos(client, clients, settings, prog){
    var app = document.getElementById('app');
    app.innerHTML = '<div class="admin-header"><h1>Promociones</h1></div><p style="color:var(--text-dim);">Cargando...</p>';
    var res = await sb.from('loyalty_customers')
      .select('id,name,phone,birthday,balance,last_stamp_at,marketing_ok,created_at')
      .eq('client_slug', client.slug).order('name');
    if(res.error){ console.error(res.error); toast('No se pudieron cargar los clientes'); renderLoyalty(client, clients, settings); return; }
    var all = res.data || [];
    var optedIn = all.filter(function(c){ return c.marketing_ok; });
    var need = prog.stamps_needed;
    var cardUrl = location.origin + '/' + client.slug + '/sello';
    var sent = {};   // ids sent in this session, so you can see your progress

    var TEMPLATES = [
      { label:'Promo general', text:'Hola {nombre} 👋 Esta semana en {negocio} tenemos una promoción especial para ti. ¡Te esperamos!' },
      { label:'Cumpleaños', text:'¡Feliz cumpleaños, {nombre}! 🎂 En {negocio} te queremos consentir: ven esta semana y recibe un regalo especial.' },
      { label:'Falta 1 sello', text:'Hola {nombre} 👋 ¡Solo te falta {faltan} sello para tu {premio} en {negocio}! Te esperamos ☕' },
      { label:'Premio listo', text:'Hola {nombre} 🎉 ¡Ya completaste tu tarjeta en {negocio}! Pasa a canjear tu {premio}.' },
      { label:'Te extrañamos', text:'Hola {nombre}, ¡te extrañamos en {negocio}! 😊 Llevas {sellos} de {total} sellos. Ven pronto y sigue juntando.' }
    ];
    var FILTERS = [
      { key:'all',     label:'Todos los que aceptaron' },
      { key:'bday7',   label:'🎂 Cumpleaños en los próximos 7 días' },
      { key:'bdaymon', label:'🎂 Cumpleaños este mes' },
      { key:'one',     label:'⏳ Les falta 1 sello' },
      { key:'ready',   label:'🎁 Premio listo sin canjear' },
      { key:'away',    label:'💤 No vienen hace más de 30 días' }
    ];

    function gtToday(){
      // Today's date in Guatemala, as a UTC-midnight Date
      var p = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Guatemala', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date()).split('-');
      return new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
    }
    function daysToBirthday(iso){
      if(!iso) return 999;
      var t = gtToday(), b = iso.split('-');
      var next = new Date(Date.UTC(t.getUTCFullYear(), +b[1]-1, +b[2]));
      if(next < t) next = new Date(Date.UTC(t.getUTCFullYear()+1, +b[1]-1, +b[2]));
      return Math.round((next - t) / 864e5);
    }
    function matches(c, key){
      if(key === 'bday7') return daysToBirthday(c.birthday) <= 7;
      if(key === 'bdaymon') return c.birthday && +c.birthday.split('-')[1] === gtToday().getUTCMonth()+1;
      if(key === 'one') return c.balance === need - 1;
      if(key === 'ready') return c.balance >= need;
      if(key === 'away') return !c.last_stamp_at || (Date.now() - new Date(c.last_stamp_at)) > 30*864e5;
      return true;
    }
    function fill(text, c){
      var first = (c.name || '').trim().split(/\s+/)[0] || '';
      var have = Math.min(c.balance, need);
      return text
        .replace(/\{nombre\}/g, first)
        .replace(/\{negocio\}/g, client.name || '')
        .replace(/\{premio\}/g, prog.reward || '')
        .replace(/\{sellos\}/g, String(have))
        .replace(/\{total\}/g, String(need))
        .replace(/\{faltan\}/g, String(Math.max(need - c.balance, 0)))
        .replace(/\{enlace\}/g, cardUrl);
    }
    function prettyPhone(p){ return p && p.length === 11 && p.indexOf('502') === 0 ? '+502 ' + p.slice(3,7) + ' ' + p.slice(7) : '+' + p; }

    app.innerHTML =
      '<div class="admin-header"><div><h1>Promociones</h1><p>'+escapeHtml(client.name)+' · por WhatsApp</p></div></div>'+
      '<div class="form-card">'+
        '<p style="margin:0;font-size:13px;color:var(--text-dim);">Solo aparecen los clientes que marcaron <b>"Acepto recibir promociones"</b>: '+
          '<b>'+optedIn.length+'</b> de '+all.length+'. Cada botón <b>Enviar</b> abre WhatsApp con el mensaje listo; tú solo tocas enviar.</p>'+
        '<div class="field"><label>1. ¿A quiénes?</label><select id="p-filter">'+
          FILTERS.map(function(f){ return '<option value="'+f.key+'">'+f.label+'</option>'; }).join('')+
        '</select></div>'+
        '<div class="field"><label>2. Mensaje</label>'+
          '<div class="templates-row">'+TEMPLATES.map(function(t, i){
            return '<button class="btn btn-ghost btn-sm" type="button" data-tpl="'+i+'">'+escapeHtml(t.label)+'</button>'; }).join('')+'</div>'+
          '<textarea id="p-text" rows="5" style="background:var(--bg);border:1px solid var(--surface-edge);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--text);font-family:inherit;resize:vertical;">'+escapeHtml(TEMPLATES[0].text)+'</textarea>'+
          '<p style="margin:0;font-size:12px;color:var(--text-dim);">Se reemplazan solos: <b>{nombre}</b> <b>{negocio}</b> <b>{premio}</b> <b>{sellos}</b> <b>{total}</b> <b>{faltan}</b> <b>{enlace}</b> (su tarjeta)</p>'+
        '</div>'+
        '<div class="field"><label>Así le llega al primero de la lista</label>'+
          '<div id="p-sample" style="background:#DCF8C6;color:#111;border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;"></div></div>'+
      '</div>'+
      '<div class="form-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;"><label style="font-size:13px;font-weight:600;color:var(--text-dim);">3. Enviar</label>'+
          '<span id="p-progress" style="font-size:13px;color:var(--text-dim);"></span></div>'+
        '<div id="p-list" style="display:flex;flex-direction:column;gap:8px;"></div>'+
      '</div>'+
      '<div class="form-actions" style="border-top:none;"><button class="btn btn-ghost" id="p-back" type="button">Volver</button></div>';

    function render(){
      var key = document.getElementById('p-filter').value;
      var text = document.getElementById('p-text').value;
      var list = optedIn.filter(function(c){ return matches(c, key); });
      if(key === 'bday7') list.sort(function(a, b){ return daysToBirthday(a.birthday) - daysToBirthday(b.birthday); });
      document.getElementById('p-sample').textContent = list.length ? fill(text, list[0]) : fill(text, { name:'María', balance: need - 1 });
      var done = list.filter(function(c){ return sent[c.id]; }).length;
      document.getElementById('p-progress').textContent = list.length ? done + ' de ' + list.length + ' enviados' : '';
      document.getElementById('p-list').innerHTML = list.length ? list.map(function(c){
        var extra = key === 'bday7' || key === 'bdaymon'
          ? (daysToBirthday(c.birthday) === 0 ? ' · 🎂 ¡hoy!' : ' · 🎂 en ' + daysToBirthday(c.birthday) + ' días')
          : ' · ' + Math.min(c.balance, need) + '/' + need + ' sellos';
        return '<div class="stat-row" style="align-items:center;gap:10px;'+(sent[c.id] ? 'opacity:.55;' : '')+'">'+
          '<span style="flex:1;min-width:0;"><b>'+escapeHtml(c.name)+'</b><br><span style="font-size:12px;color:var(--text-dim);">'+escapeHtml(prettyPhone(c.phone))+extra+'</span></span>'+
          '<button class="btn '+(sent[c.id] ? 'btn-ghost' : 'btn-primary')+' btn-sm" type="button" data-send="'+escapeHtml(c.id)+'">'+(sent[c.id] ? '✓ Enviado' : 'Enviar')+'</button>'+
        '</div>';
      }).join('') : '<p style="color:var(--text-dim);font-size:13px;margin:0;">Nadie cumple con este filtro por ahora.</p>';
      document.querySelectorAll('[data-send]').forEach(function(btn){
        btn.onclick = function(){
          var c = optedIn.find(function(x){ return x.id === btn.getAttribute('data-send'); });
          window.open('https://wa.me/' + c.phone + '?text=' + encodeURIComponent(fill(document.getElementById('p-text').value, c)), '_blank');
          sent[c.id] = true;
          render();
        };
      });
    }
    document.getElementById('p-filter').onchange = render;
    document.getElementById('p-text').oninput = render;
    document.querySelectorAll('[data-tpl]').forEach(function(btn){
      btn.onclick = function(){ document.getElementById('p-text').value = TEMPLATES[+btn.getAttribute('data-tpl')].text; render(); };
    });
    document.getElementById('p-back').onclick = function(){ renderLoyalty(client, clients, settings); };
    render();
  }

  /* ---------------- NFC WRITER VIEW ----------------
     Uses the Web NFC API (NDEFReader), which ONLY exists on Android
     with Google Chrome. It is not implemented by Safari/iOS or by
     desktop browsers — there is no workaround for that, it's a
     platform restriction. On any unsupported device we show an
     explanation instead of a broken tool. */
  function renderNfcWriter(clients, settings){
    var app = document.getElementById('app');
    var supported = ('NDEFReader' in window);

    if(!supported){
      app.innerHTML =
        '<div class="admin-header"><h1>Escribir NFC</h1></div>'+
        '<div class="form-card">'+
          '<p style="color:var(--text-dim);font-size:14px;line-height:1.5;">'+
            'Esta herramienta solo funciona en un teléfono <b>Android</b> usando el navegador <b>Google Chrome</b>. '+
            'Tu dispositivo o navegador actual no lo soporta (en iPhone nunca va a funcionar, es una restricción de Apple, no nuestra).'+
          '</p>'+
          '<p style="color:var(--text-dim);font-size:14px;line-height:1.5;">'+
            'Mientras tanto, puedes seguir usando la app <b>NFC Tools</b> para programar tus tags.'+
          '</p>'+
          '<div class="form-actions"><button class="btn btn-ghost" id="nfcBackBtn" type="button">Volver</button></div>'+
        '</div>';
      document.getElementById('nfcBackBtn').onclick = function(){ renderAdmin(clients, settings); };
      return;
    }

    if(!clients.length){
      app.innerHTML =
        '<div class="admin-header"><h1>Escribir NFC</h1></div>'+
        '<div class="form-card">'+
          '<p style="color:var(--text-dim);font-size:14px;">Todavía no tienes ningún cliente creado. Crea uno primero para poder escribir su link en un tag.</p>'+
          '<div class="form-actions"><button class="btn btn-ghost" id="nfcBackBtn" type="button">Volver</button></div>'+
        '</div>';
      document.getElementById('nfcBackBtn').onclick = function(){ renderAdmin(clients, settings); };
      return;
    }

    app.innerHTML =
      '<div class="admin-header"><h1>Escribir NFC</h1></div>'+
      '<div class="form-card">'+
        '<p style="color:var(--text-dim);font-size:13px;line-height:1.5;">'+
          'Elige el cliente, toca "Escribir tag", y cuando el teléfono te avise, acerca el sticker NFC en blanco a la parte de atrás del celular sin moverlo hasta que aparezca el mensaje de listo.'+
        '</p>'+
        '<div class="field"><label>Cliente</label>'+
          '<select id="nfcClientSelect">'+
            clients.map(function(c){ return '<option value="'+escapeHtml(c.slug)+'">'+escapeHtml(c.name)+'</option>'; }).join('')+
          '</select>'+
        '</div>'+
        '<div class="field"><label>Link que se va a escribir</label>'+
          '<div class="link-box"><span id="nfcLinkPreview"></span></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="nfcWriteActionBtn" type="button">📡 Escribir tag</button>'+
        '<p id="nfcStatus" style="font-size:14px;min-height:20px;"></p>'+
        '<div class="form-actions"><button class="btn btn-ghost" id="nfcBackBtn" type="button">Volver</button></div>'+
      '</div>';

    document.getElementById('nfcBackBtn').onclick = function(){ renderAdmin(clients, settings); };

    function updateLinkPreview(){
      var slug = document.getElementById('nfcClientSelect').value;
      document.getElementById('nfcLinkPreview').textContent = baseUrl() + slug;
    }
    document.getElementById('nfcClientSelect').addEventListener('change', updateLinkPreview);
    updateLinkPreview();

    document.getElementById('nfcWriteActionBtn').onclick = async function(){
      var slug = document.getElementById('nfcClientSelect').value;
      var link = baseUrl() + slug;
      var statusEl = document.getElementById('nfcStatus');
      statusEl.style.color = 'var(--text-dim)';
      statusEl.textContent = 'Acerca el tag NFC en blanco a la parte de atrás del teléfono y no lo muevas...';
      try{
        var ndef = new NDEFReader();
        await ndef.write({ records: [{ recordType: 'url', data: link }] });
        statusEl.style.color = 'var(--accent-default)';
        statusEl.textContent = '✅ ¡Listo! Se escribió: ' + link;
        toast('Tag escrito correctamente');
      }catch(err){
        var name = err && err.name;
        var msg = 'No se pudo escribir el tag.';
        if(name === 'NotAllowedError'){ msg = 'Permiso de NFC denegado. Revisa que el NFC esté encendido en Ajustes del teléfono y vuelve a intentar.'; }
        else if(name === 'NotSupportedError'){ msg = 'Este tag no se puede escribir — puede estar bloqueado, dañado, o no ser compatible.'; }
        else if(name === 'NetworkError'){ msg = 'Se perdió el contacto con el tag antes de terminar. No lo alejes del teléfono hasta ver el mensaje de listo — intenta de nuevo.'; }
        else if(name === 'AbortError'){ msg = 'No se detectó ningún tag a tiempo. Intenta de nuevo y acércalo más rápido.'; }
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = '❌ '+msg+(err && err.message ? ' ('+err.message+')' : '');
        toast('No se pudo escribir el tag');
      }
    };
  }

  /* ---------------- PANEL SETTINGS VIEW ---------------- */
  function renderSettings(clients, settings){
    var bg = (settings && settings.background) || '';
    var textColor = (settings && settings.text_color) || '';
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="admin-header"><h1>Ajustes del panel</h1></div>'+

    function currentSlug(){
      return isEdit ? existing.slug : uniqueSlug(document.getElementById('f-name').value, clients);
    }
    var qrInstance = null;
    function updateLinkPreview(){
      var link = baseUrl()+currentSlug();
      document.getElementById('linkPreview').textContent = link;
      if(window.QRCode){
        if(!qrInstance){
          qrInstance = new QRCode(document.getElementById('qrCanvas'), { text: link, width: 140, height: 140 });
        } else {
          qrInstance.makeCode(link);
        }
      }
    }
    updateLinkPreview();
    document.getElementById('f-name').addEventListener('input', function(){ if(!isEdit) updateLinkPreview(); });

    document.getElementById('downloadQrBtn').onclick = function(){
      var canvas = document.querySelector('#qrCanvas canvas');
      if(!canvas){ toast('El QR todavía está cargando, intenta de nuevo'); return; }
      var link = document.createElement('a');
      link.download = currentSlug()+'-qr.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    document.querySelectorAll('.template-swatch').forEach(function(btn){
      btn.onclick = function(){
        var t = TEMPLATES.find(function(x){ return x.key === btn.getAttribute('data-key'); });
        if(!t) return;
        document.getElementById('f-accent').value = t.accent;
        document.getElementById('f-font').value = t.font;
        toast('Plantilla "'+t.label+'" aplicada — guarda para confirmar');
      };
    });

    document.getElementById('f-logo-file').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      if(file.size > 10 * 1024 * 1024){ toast('La imagen debe pesar menos de 10MB'); return; }
      toast('Subiendo imagen...');
      try{
        var url = await Storage.uploadLogo(file, currentSlug());
        document.getElementById('f-logo').value = url;
        toast('Logo subido');
      }catch(err){
        toast('No se pudo subir: '+(err && err.message ? err.message : 'error'));
      }

    var removeBgBtn = document.getElementById('removeBgBtn');
    if(removeBgBtn){
      removeBgBtn.onclick = function(){
        document.getElementById('f-bg-image').value = '';
        removeBgBtn.parentElement.remove();
        toast('Imagen de fondo quitada — guarda para confirmar');
      };
    }

    document.getElementById('f-bg-file').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      if(file.size > 10 * 1024 * 1024){ toast('La imagen debe pesar menos de 10MB'); return; }
      toast('Subiendo imagen de fondo...');
      try{
        var url = await Storage.uploadLogo(file, currentSlug()+'-bg');
        document.getElementById('f-bg-image').value = url;
        toast('Fondo subido');
      }catch(err){
        toast('No se pudo subir: '+(err && err.message ? err.message : 'error'));

        toast('Subiendo imagen de fondo...');
        try{
          var url = await Storage.uploadLogo(file, currentSlug()+'-bg-'+k);

          document.getElementById('f-bg'+k+'-status').style.display = '';
          toast('Fondo subido');
        }catch(err){
          toast('No se pudo subir: '+(err && err.message ? err.message : 'error'));
        }
      });
      document.getElementById('f-bg'+k+'-clear').onclick = function(){
        document.getElementById('f-bg'+k+'-image').value = '';
        document.getElementById('f-bg'+k+'-status').style.display = 'none';

        toast('Imagen quitada — guarda para confirmar');

        toast('Link copiado');
      }).catch(function(){ toast(link); });

    document.getElementById('addRowBtn').onclick = function(){
      if(document.querySelectorAll('.button-row').length >= 9){ toast('Máximo 9 opciones'); return; }
      var editor = document.getElementById('buttonsEditor');

      editor.insertAdjacentHTML('beforeend', buttonRowHtml({icon:'website',label:'',url:''}, idx));
      wireRow(editor.lastElementChild);
    };

    function readRowData(row){
      return {
        icon: row.querySelector('.row-icon').value,
        color: row.querySelector('.row-color').value,
        label: row.querySelector('.label-input').value,
        url: row.querySelector('.url-input').value,
        iconImage: row.querySelector('.row-icon-image').value
      };
    }

    function wireRow(row){
      row.querySelector('.row-remove').onclick = function(){
        if(document.querySelectorAll('.button-row').length <= 1){ toast('Debe quedar al menos una opción'); return; }
        row.remove();
      };
      var iconFile = row.querySelector('.row-icon-file');
      if(iconFile){
        iconFile.addEventListener('change', async function(e){
          var file = e.target.files[0];
          if(!file) return;
          if(file.size > 10 * 1024 * 1024){ toast('El ícono debe pesar menos de 10MB'); return; }
          toast('Subiendo ícono...');
          try{
            var data = readRowData(row);
            data.iconImage = await Storage.uploadLogo(file, 'icon');
            row.innerHTML = buttonRowInnerHtml(data);
            wireRow(row);
            toast('Ícono subido');
          }catch(err){
            toast('No se pudo subir: '+(err && err.message ? err.message : 'error'));
          }
        });
      }
      var removeIconBtn = row.querySelector('.row-remove-icon');
      if(removeIconBtn){
        removeIconBtn.onclick = function(){
          var data = readRowData(row);
          data.iconImage = '';
          row.innerHTML = buttonRowInnerHtml(data);
          wireRow(row);
        };
      }

    document.querySelectorAll('.button-row').forEach(wireRow);

    document.getElementById('cancelBtn').onclick = function(){ renderAdmin(clients, settings); };

        if(!ok) return;
        try{
          await Storage.remove(existing.slug);
          toast('Cliente eliminado');
          renderAdmin(await Storage.load(), settings);
        }catch(e){
          toast('No se pudo borrar: '+(e && e.message ? e.message : 'error'));
        }
      };
    }

    document.getElementById('saveBtn').onclick = async function(){
      var name = document.getElementById('f-name').value.trim();
      if(!name){ toast('Ponle un nombre al negocio'); return; }
      var rows = Array.from(document.querySelectorAll('.button-row'));
      var all = rows.map(function(r, i){
        return {
          pos: i + 1,
          icon: r.querySelector('.row-icon').value,
          color: r.querySelector('.row-color').value,
          iconImage: r.querySelector('.row-icon-image').value.trim(),
          label: r.querySelector('.label-input').value.trim(),
          url: r.querySelector('.url-input').value.trim()
        };
      });
      var incomplete = all.find(function(b){ return (b.label && !b.url) || (!b.label && b.url); });
      if(incomplete){
        toast('A la opción '+incomplete.pos+' le falta el '+(incomplete.label ? 'link' : 'texto'));
        return;
      }
      var buttons = all.filter(function(b){ return b.label && b.url; });
      if(!buttons.length){ toast('Agrega al menos una opción con texto y link'); return; }

      var slug = isEdit ? existing.slug : uniqueSlug(name, clients);
      var newClient = {
        slug: slug,
        name: name,
        contact_name: document.getElementById('f-contact-name').value.trim(),
        tagline: document.getElementById('f-tagline').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        capture_leads: document.getElementById('f-capture').checked,
        capture_type: document.getElementById('f-capture-type').value,
        whatsapp_enabled: document.getElementById('f-whatsapp').checked,
        save_contact_enabled: document.getElementById('f-save-contact').checked,
        accent: document.getElementById('f-accent').value,
        logo: document.getElementById('f-logo').value.trim() || name.slice(0,1).toUpperCase(),
        background: document.getElementById('f-bg-image').value.trim() || document.getElementById('f-bg-color').value,
        font: document.getElementById('f-font').value,
        text_color: document.getElementById('f-text-auto').checked ? '' : document.getElementById('f-text-color').value,
        card_color: document.getElementById('f-card-auto').checked ? '' : document.getElementById('f-card-color').value,
        buttons: buttons
      };
      var bgTablet = document.getElementById('f-bgt-image').value.trim();
      var bgDesktop = document.getElementById('f-bgd-image').value.trim();
      if(bgTablet || (existing && existing.background_tablet !== undefined)){ newClient.background_tablet = bgTablet; }
      if(bgDesktop || (existing && existing.background_desktop !== undefined)){ newClient.background_desktop = bgDesktop; }
      var bgMenuEl = document.getElementById('f-bg-menu');
      if(bgMenuEl && (bgMenuEl.checked || (existing && existing.bg_in_menu !== undefined))){ newClient.bg_in_menu = bgMenuEl.checked; }
      var heroEl = document.getElementById('f-menu-hero');
      if(heroEl && (!heroEl.checked || (existing && existing.menu_hero !== undefined))){ newClient.menu_hero = heroEl.checked; }

      try{
        await Storage.upsert(newClient);
        toast('Guardado');
        renderAdmin(await Storage.load(), settings);
      }catch(e){
        toast('No se pudo guardar: '+(e && e.message ? e.message : 'error'));
      }
    };
  }

  route();
})();
</script>
</body>
</html>
